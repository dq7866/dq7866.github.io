# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 知作坊
subtitle: 心灵火花的闪烁
description: 知作坊——故事、歌词与创作手记。「今世警世百回」系列连载，另有免安装网页小游戏合集。
keywords: 知作坊,今世警世百回,故事,歌词,创作手记,尘世悟说,免费小游戏
author: 尘世悟说
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://dq7866.online
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'games/**'
  - 'symbolpass/**'
  - 'toolbox/**'
  - 'edu/**'
  - 'zanan/**'
  - 'forest/**'
  - 'bike/**'
  - 'guardian/**'
  - 'offline/**'
  - 'admin/**'
  - 'stats.js'
  - 'fs-button.js'
  - 'site-cards.js'
  - 'site-search.js'
  - '404.html'
  - 'login-test.html'
# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
## .nojekyll：让 GitHub Pages 跳过 Jekyll 处理，纯静态站部署更快更稳
include:
  - '.nojekyll'
exclude:
  - 'forest - 副本/**'
  - 'bike - 副本/**'
  - 'guardian - 副本/**'
  - 'forest/assets/audio/**'
  # 亲子知识擂台是本地 Node 服务端工程，不是站点静态资源。
  # 整目录排除：里面有 data/admin/auth.json（管理员口令）、
  # data/profiles.json（孩子的学习档案）、node_modules、题库等，
  # 一旦被 hexo generate 复制进 public/ 就会随 GitHub Pages 公开到网上。
  - 'parent-child-knowledge-game/**'
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Sitemap
## 生成 /sitemap.xml（含文章、归档、分类、标签页）
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Ad loader（默认关闭，详见 source/ads.js 顶部配置）
inject:
  head:
    - <script src="/ads.js" defer></script>

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
## Cloudflare Pages 已改为监听 GitHub 分支 source 自动构建，无需 hexo deploy。
## 发布：git add -A && git commit -m "update" && git push origin HEAD:source

