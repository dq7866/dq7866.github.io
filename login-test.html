<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录自检 · 知作坊</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf6f1">
<style>
  :root{--ink:#26221e;--sub:#8a8078;--line:#ece5dd;--brand:#ff4d00;--ok:#0a8f4c;--bad:#d43f2f;--warn:#c2410c;}
  *{box-sizing:border-box}
  body{margin:0;padding:16px 14px 40px;background:#faf6f1;color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.65}
  .wrap{max-width:560px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;font-size:19px;font-weight:700;line-height:38px;text-align:center}
  h1{font-size:18px;margin:0}
  .sub{font-size:12px;color:var(--sub);margin-top:2px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px}
  h2{font-size:14px;margin:0 0 8px;color:var(--ink)}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed #f0ece7}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--sub);flex:0 0 auto}
  .row .v{text-align:right;word-break:break-all}
  .g{color:var(--ok);font-weight:600}.r{color:var(--bad);font-weight:600}.y{color:var(--warn);font-weight:600}
  .verdict{font-size:14px;line-height:1.75;background:#fffaf7;border:1px solid #ffe3d3;border-radius:10px;padding:11px 13px;margin-top:4px}
  .verdict b{color:var(--brand)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  button{flex:1;min-width:120px;padding:11px 12px;font-size:14px;border-radius:10px;border:1px solid var(--line);background:#f6f2ee;color:#4a4238;cursor:pointer}
  button.p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .tip{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}
  pre{font-size:11.5px;overflow:auto;background:#f6f2ee;border-radius:8px;padding:9px;color:#5f574f;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">知</div><div><h1>登录自检</h1><div class="sub">dq7866.online · 一次性结论表</div></div></div>

  <div class="card">
    <h2>① 你的环境</h2>
    <div id="env"></div>
  </div>

  <div class="card">
    <h2>② 本机存储（决定登录状态能不能记住）</h2>
    <div id="store"></div>
  </div>

  <div class="card">
    <h2>③ 门卫通道与登录状态</h2>
    <div id="br"></div>
  </div>

  <div class="card">
    <h2>结论与建议</h2>
    <div class="verdict" id="verdict">正在检测…</div>
    <div class="btns" style="margin-top:12px">
      <button class="p" id="again">重新检测</button>
      <button id="clear">清除本机登录状态</button>
      <button id="back">返回工具箱</button>
    </div>
    <div class="tip">本页只做只读检测，不会登录、不会发送验证码。「清除本机登录状态」只清本机记录的登录凭证，云端账号不受影响。</div>
    <pre id="raw" style="display:none"></pre>
  </div>
</div>

<script>
(function () {
  "use strict";
  var ORIGIN = "https://zhizuofang.app.workbuddy.host";
  var IS_DEV = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  var BRIDGE = ORIGIN + "/bridge.html" + (IS_DEV ? "?dev=1" : "");
  var LS_SESSION = "zhz_session_v1";
  var raw = {};

  function $(id) { return document.getElementById(id); }
  function row(k, v, cls) { return '<div class="row"><span class="k">' + k + '</span><span class="v ' + (cls || "") + '">' + v + '</span></div>'; }
  function yn(b, t, f) { return b ? '<span class="g">' + (t || "可用") + '</span>' : '<span class="r">' + (f || "不可用") + '</span>'; }

  function lsTest() {
    try { localStorage.setItem("__z", "1"); var v = localStorage.getItem("__z"); localStorage.removeItem("__z"); return v === "1"; }
    catch (e) { return false; }
  }
  function cookieTest() {
    try { document.cookie = "__zc=1;path=/"; var ok = document.cookie.indexOf("__zc=1") >= 0; document.cookie = "__zc=;max-age=0;path=/"; return ok; }
    catch (e) { return false; }
  }
  function readSession() {
    try { var o = JSON.parse(localStorage.getItem(LS_SESSION) || "null"); return o && o.key && o.value ? o : null; }
    catch (e) { return null; }
  }

  function renderEnv() {
    var ua = navigator.userAgent;
    var isWeChat = /MicroMessenger/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    var html = "";
    html += row("访问地址", location.host);
    html += row("协议", location.protocol === "https:" ? '<span class="g">HTTPS</span>' : '<span class="r">' + location.protocol + '（必须 HTTPS）</span>');
    html += row("设备", isMobile ? (isIOS ? "iOS / iPadOS" : "Android / 移动端") : "桌面浏览器");
    html += row("微信内置浏览器", isWeChat ? '<span class="y">是（微信里可能拦存储，建议改用系统浏览器）</span>' : "否");
    html += row("浏览器内核", (ua.match(/(MicroMessenger|Edg|Chrome|Firefox|Version)\/[\d.]+/) || ["未知"])[0]);
    $("env").innerHTML = html;
    raw.env = { ua: ua, isWeChat: isWeChat, isIOS: isIOS, isMobile: isMobile };
    return { isWeChat: isWeChat, isMobile: isMobile };
  }

  function renderStore() {
    var ls = lsTest(), ck = cookieTest(), s = readSession();
    var html = "";
    html += row("localStorage", yn(ls, "可用", "被禁用"));
    html += row("Cookie", yn(ck, "可写", "被禁用"));
    html += row("无痕/隐私模式", ls ? "未检测到" : '<span class="y">疑似开启</span>');
    html += row("已保存的登录凭证", s ? '<span class="g">有（' + String(s.key).slice(-8) + '…）</span>' : "无");
    $("store").innerHTML = html;
    raw.storage = { localStorage: ls, cookie: ck, hasSession: !!s };
    return { ls: ls, ck: ck, session: s };
  }

  function probeBridge(session) {
    return new Promise(function (resolve) {
      var done = false;
      var iframe = document.createElement("iframe");
      iframe.style.cssText = "position:absolute;width:0;height:0;border:0;left:-9999px;";
      iframe.src = BRIDGE;
      document.body.appendChild(iframe);

      var out = { ready: false, bridgeStorage: "", sessionOk: false, session: null };
      function finish() {
        if (done) return; done = true;
        try { iframe.parentNode.removeChild(iframe); } catch (e) {}
        resolve(out);
      }
      window.addEventListener("message", function (ev) {
        if (ev.origin !== ORIGIN) return;
        var d = ev.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "gate:ready") {
          out.ready = true; out.bridgeStorage = d.storage || "";
          iframe.contentWindow.postMessage({ type: "gate:session-state" }, ORIGIN);
          return;
        }
        if (d.type === "gate:session-state") {
          out.sessionOk = !!d.ok;
          out.session = d.session ? { id: (d.session.user && d.session.user.id) || "", exp: d.session.expiresAt || 0 } : null;
          finish();
        }
      });
      var tries = 0;
      function hello() {
        if (done) return;
        if (++tries > 40) { finish(); return; }
        try { iframe.contentWindow.postMessage({ type: "gate:hello", session: session }, ORIGIN); } catch (e) {}
        setTimeout(hello, 250);
      }
      hello();
      setTimeout(finish, 12000);
    });
  }

  async function run() {
    $("verdict").textContent = "正在检测…";
    var env = renderEnv();
    var st = renderStore();
    var br = await probeBridge(st.session);

    var html = "";
    html += row("门卫通道", br.ready ? yn(true, "已连通") : '<span class="r">连不上</span>' + (env.isWeChat ? "（微信里常见）" : "（检查网络）"));
    html += row("iframe 内存储", br.bridgeStorage === "ok" ? '<span class="g">可用</span>' : '<span class="y">受限（已由本页托管登录状态）</span>');
    html += row("登录状态读取", br.sessionOk ? '<span class="g">已登录</span>' : "未登录");
    html += row("用户 ID", br.session && br.session.id ? br.session.id : "—");
    $("br").innerHTML = html;
    raw.bridge = br;

    var v = "";
    if (!br.ready) {
      v = "<b>门卫通道连不上。</b> " + (env.isWeChat
        ? "你正处在微信内置浏览器里——它经常拦截跨站存储与请求。请点右上角「···」→「在浏览器打开」后重试。"
        : "请检查网络后点「重新检测」。");
    } else if (!st.ls && !st.ck) {
      v = "<b>本机存储被禁用</b>（无痕模式 / 浏览器设置里屏蔽了 Cookie 与网站数据）。登录状态无法保存，会出现“登录后又回到登录页”。请退出无痕模式，或在浏览器设置里允许本站使用 Cookie。";
    } else if (!br.bridgeStorage || br.bridgeStorage !== "ok") {
      v = "<b>跨站存储受限，但已自动兜底</b>：门卫把登录状态托管到了 dq7866.online 本页存储里。" +
          (br.sessionOk ? "当前已登录，可以正常使用。" : "若登录后仍回到登录页，请把这条结论告诉开发者。");
    } else if (br.sessionOk) {
      v = "<b>一切正常，已登录。</b>额度、兑换码都可以正常使用。";
    } else {
      v = "<b>环境正常，只是还没登录。</b>回到页面点「开始骑行」或工具箱入口登录即可（首次用手机号 + 验证码 + 设置密码）。";
    }
    $("verdict").innerHTML = v;
    $("raw").textContent = JSON.stringify(raw, null, 2);
  }

  $("again").onclick = run;
  $("clear").onclick = function () {
    try { localStorage.removeItem(LS_SESSION); } catch (e) {}
    alert("已清除本机保存的登录凭证。");
    run();
  };
  $("back").onclick = function () { location.href = "/toolbox/"; };

  run();
})();
</script>
</body>
</html>
