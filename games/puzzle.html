  .diff-btn { flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; background: rgba(255,255,255,0.2); color: #fff; font-weight: 600; font-size: 0.8rem; cursor: pointer; }

    display: grid;
    gap: 6px;
    background: rgba(255,255,255,0.15);

    margin: 0 auto;

    transition: transform 0.15s;

  .tile:active { transform: scale(0.95); }

<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">🧩 数字拼图</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>
  <div class="info-row">
    <div class="info-box"><div class="info-label">步数</div><div class="info-val" id="moves">0</div></div>
    <div class="info-box"><div class="info-label">用时</div><div class="info-val" id="time">00:00</div></div>
    <div class="info-box"><div class="info-label">最佳</div><div class="info-val" id="best">--</div></div>
  </div>
  <div class="diff-row">
    <button class="diff-btn active" data-n="3">3×3</button>
    <button class="diff-btn" data-n="4">4×4</button>
    <button class="diff-btn" data-n="5">5×5</button>
  </div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button class="ctrl-btn" id="shuffleBtn">🔀 打乱</button>
    <button class="ctrl-btn" id="solverBtn">💡 自动</button>
  </div>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">🎉</div>
    <h2 id="mTitle">完成！</h2>
    <div class="praise" id="mPraise"></div>
    <p id="mMsg"></p>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(() => {
  let N = 3, board = [], moves = 0, solved = false;
  let startTime = 0, timerInt = null, started = false;
  let bests = JSON.parse(localStorage.getItem('puzzleBest') || '{}');
  const boardEl = document.getElementById('board');

  function init() {
    board = [];
    for (let i = 1; i < N*N; i++) board.push(i);
    board.push(0);
    moves = 0; solved = false; started = false;
    stopTimer();
    document.getElementById('moves').textContent = '0';
    document.getElementById('time').textContent = '00:00';
    document.getElementById('best').textContent = bests[N] ? bests[N] + '步' : '--';
    shuffle();
    render();
  }

  function shuffle() {
    // 通过随机移动保证可解
    for (let i = 0; i < N*N*20; i++) {
      const neighbors = getEmptyNeighbors();
      const [r, c] = neighbors[Math.floor(Math.random()*neighbors.length)];
      swapWithEmpty(r, c);
    }
    moves = 0;
  }

  function getEmptyPos() {
    const idx = board.indexOf(0);
    return [Math.floor(idx/N), idx % N];
  }

  function getEmptyNeighbors() {
    const [er, ec] = getEmptyPos();
    const res = [];
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc]) => {
      const r = er+dr, c = ec+dc;
      if (r>=0 && r<N && c>=0 && c<N) res.push([r,c]);
    });
    return res;
  }

  function swapWithEmpty(r, c) {
    const [er, ec] = getEmptyPos();
    const idx1 = er*N+ec, idx2 = r*N+c;
    [board[idx1], board[idx2]] = [board[idx2], board[idx1]];
  }

  function render() {
    boardEl.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
    boardEl.innerHTML = '';
    board.forEach((v, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile' + (v === 0 ? ' empty' : '');
      const correct = v === i+1;
      if (correct && v !== 0) tile.classList.add('correct');
      tile.textContent = v || '';
      if (v !== 0) tile.onclick = () => move(i);
      boardEl.appendChild(tile);
    });
  }

  function move(idx) {
    if (solved) return;
    const r = Math.floor(idx/N), c = idx % N;
    const [er, ec] = getEmptyPos();
    if (Math.abs(r-er) + Math.abs(c-ec) !== 1) { Sound.invalid(); return; }
    if (!started) { started = true; startTimer(); }
    swapWithEmpty(r, c);
    moves++;
    Sound.click();
    document.getElementById('moves').textContent = moves;
    render();
    if (isSolved()) win();
  }

  function isSolved() {
    for (let i = 0; i < N*N-1; i++) if (board[i] !== i+1) return false;
    return true;
  }

  function win() {
    solved = true;
    stopTimer();
    const t = getTime();
    if (!bests[N] || moves < bests[N]) {
      bests[N] = moves;
      localStorage.setItem('puzzleBest', JSON.stringify(bests));
    }
    User.addScore(Math.max(0, 10000 - moves*50 - t*10), true, t);
    Sound.win();
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = '🧩';
    document.getElementById('mTitle').textContent = '拼图大师！';
    document.getElementById('mPraise').textContent = getPraise();
    document.getElementById('mMsg').textContent = `${moves} 步 · ${formatTime(t)}`;
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
    launchFireworks(document.getElementById('fw'));
    setTimeout(()=>launchFireworks(document.getElementById('fw')),400);
    m.classList.add('show');
  }

  // 自动求解（简单贪心：把数字归位）
  async function autoSolve() {
    if (solved) return;
    started = true; startTimer();
    for (let target = 1; target < N*N; target++) {
      const ti = target - 1;
      // 找到 target 的位置
      let ci = board.indexOf(target);
      while (ci !== ti) {
        const cr = Math.floor(ci/N), cc = ci % N;
        const tr = Math.floor(ti/N), tc = ti % N;
        const [er, ec] = getEmptyPos();
        // 简单策略：移动空格到 target 旁边，然后移动 target
        let nextMove = null;
        // 尝试把空格移到 target 旁边
        if (cr > tr && cr-1 >= 0) nextMove = [cr-1, cc];
        else if (cr < tr && cr+1 < N) nextMove = [cr+1, cc];
        else if (cc > tc && cc-1 >= 0) nextMove = [cr, cc-1];
        else if (cc < tc && cc+1 < N) nextMove = [cr, cc+1];
        if (nextMove) {
          // 先把空格移到 nextMove
          await moveEmptyTo(nextMove[0], nextMove[1]);
          // 然后 target 移到空格
          swapWithEmpty(cr, cc);
          moves++;
          document.getElementById('moves').textContent = moves;
          render();
          await sleep(80);
          ci = board.indexOf(target);
        } else break;
      }
    }
    if (isSolved()) win();
  }

  async function moveEmptyTo(tr, tc) {
    while (true) {
      const [er, ec] = getEmptyPos();
      if (er === tr && ec === tc) return;
      let nr, nc;
      if (er > tr) nr = er-1;
      else if (er < tr) nr = er+1;
      else nr = er;
      if (ec > tc) nc = ec-1;
      else if (ec < tc) nc = ec+1;
      else nc = ec;
      swapWithEmpty(nr, nc);
      moves++;
      document.getElementById('moves').textContent = moves;
      render();
      await sleep(60);
    }
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function startTimer() { startTime = Date.now(); timerInt = setInterval(() => document.getElementById('time').textContent = formatTime(getTime()), 1000); }
  function stopTimer() { if (timerInt) clearInterval(timerInt); }
  function getTime() { return Math.floor((Date.now() - startTime) / 1000); }

  document.querySelectorAll('.diff-btn').forEach(btn => btn.onclick = () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    N = +btn.dataset.n;
    init();
  });
  document.getElementById('shuffleBtn').onclick = () => { Sound.click(); init(); };
  document.getElementById('solverBtn').onclick = () => { Sound.click(); autoSolve(); };
  document.getElementById('mHome').onclick = () => location.href = 'index.html';

  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
})();
</script>
