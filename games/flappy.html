<style>

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
  .back-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 7px 12px; border-radius: 20px; text-decoration: none; font-size: 0.82rem; }

<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">🐦 FLAPPY NEON</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>
  <div class="info-row">
    <div class="info-box"><div class="info-label">分数</div><div class="info-val" id="score">0</div></div>
    <div class="info-box"><div class="info-label">最高</div><div class="info-val" id="best">0</div></div>
  </div>
  <canvas id="c" width="380" height="500"></canvas>
  <p class="tip">👆 点击/空键 让小鸟跳跃 · 穿过霓虹管道</p>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">💥</div>
    <h2 id="mTitle">Game Over</h2>
    <div class="praise" id="mPraise"></div>
    <div class="final-score" id="mScore">0</div>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND = H - 40;

  let bird, pipes, score, best, frame, gameOver, started;
  let particles = [];
  best = parseInt(localStorage.getItem('flappyBest')||'0');
  document.getElementById('best').textContent = best;

  function init() {
    bird = { x: 100, y: H/2, vy: 0, r: 16, rot: 0, trail: [] };
    pipes = [];
    score = 0; frame = 0; gameOver = false; started = false;
    particles = [];
    updateInfo();
  }

  function updateInfo() {
    document.getElementById('score').textContent = score;
  }

  function jump() {
    if (gameOver) return;
    if (!started) started = true;
    bird.vy = -8;
    Sound.click();
    // 跳跃粒子
    for (let i = 0; i < 5; i++) {
      particles.push({
        x: bird.x - 10, y: bird.y + 5,
        vx: -Math.random()*3-1, vy: Math.random()*2-1,
        life: 20, color: '#5fdea0', size: 2+Math.random()*2
      });
    }
  }

  function loop() {
    frame++;
    ctx.fillStyle = 'rgba(10,10,26,0.3)';
    ctx.fillRect(0,0,W,H);

    if (started && !gameOver) {
      // 重力
      bird.vy += 0.5;
      bird.y += bird.vy;
      bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy * 0.08));

      // 拖尾
      bird.trail.push({x: bird.x, y: bird.y});
      if (bird.trail.length > 12) bird.trail.shift();

      // 生成管道
      if (frame % 90 === 0) {
        const gap = 140;
        const top = 60 + Math.random() * (GROUND - 200 - gap);
        pipes.push({ x: W + 40, top, gap, passed: false, color: ['#5fdea0','#f093fb','#48dbfb','#feca57'][Math.floor(Math.random()*4)] });
      }

      // 移动管道
      pipes.forEach(p => p.x -= 2.8);
      pipes = pipes.filter(p => p.x > -80);

      // 碰撞检测
      for (const p of pipes) {
        if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 60) {
          if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + p.gap) {
            return endGame();
          }
        }
        if (!p.passed && p.x + 60 < bird.x) {
          p.passed = true;
          score++;
          Sound.select();
          updateInfo();
        }
      }

      // 地面/天花板
      if (bird.y + bird.r > GROUND || bird.y - bird.r < 0) return endGame();
    }

    // 画管道
    pipes.forEach(p => {
      ctx.shadowBlur = 15;
      ctx.shadowColor = p.color;
      ctx.fillStyle = p.color;
      // 上管道
      ctx.fillRect(p.x, 0, 60, p.top);
      ctx.fillRect(p.x - 5, p.top - 20, 70, 20);
      // 下管道
      ctx.fillRect(p.x, p.top + p.gap, 60, GROUND - p.top - p.gap);
      ctx.fillRect(p.x - 5, p.top + p.gap, 70, 20);
      ctx.shadowBlur = 0;
    });

    // 画拖尾
    if (started) {
      bird.trail.forEach((t, i) => {
        const a = i / bird.trail.length;
        ctx.fillStyle = `rgba(95,222,160,${a*0.4})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, bird.r * a * 0.8, 0, Math.PI*2);
        ctx.fill();
      });
    }

    // 画鸟
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#feca57';
    ctx.fillStyle = '#feca57';
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI*2);
    ctx.fill();
    // 翅膀
    ctx.fillStyle = '#ff9f43';
    const wingY = Math.sin(frame*0.3) * 4;
    ctx.beginPath();
    ctx.ellipse(-4, 2 + wingY, 8, 5, 0, 0, Math.PI*2);
    ctx.fill();
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -4, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(7, -4, 2.5, 0, Math.PI*2);
    ctx.fill();
    // 嘴
    ctx.fillStyle = '#ff6348';
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(20, 2); ctx.lineTo(10, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 粒子
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.life--;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / 20;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    // 地面
    ctx.fillStyle = '#1a1a3e';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = '#5fdea0';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#5fdea0';
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(W, GROUND);
    ctx.stroke();
    ctx.shadowBlur = 0;

    if (!started) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('👆 点击开始', W/2, H/2 - 50);
    }

    requestAnimationFrame(loop);
  }

  function endGame() {
    gameOver = true;
    if (score > best) { best = score; localStorage.setItem('flappyBest', best); document.getElementById('best').textContent = best; }
    User.addScore(score * 10, false, 0);
    Sound.lose();
    // 爆炸粒子
    for (let i = 0; i < 30; i++) {
      particles.push({
        x: bird.x, y: bird.y,
        vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
        life: 30, color: ['#feca57','#ff6348','#5fdea0'][Math.floor(Math.random()*3)], size: 3+Math.random()*3
      });
    }
    setTimeout(() => {
      const m = document.getElementById('modal');
      document.getElementById('mIcon').textContent = score >= 20 ? '🏆' : '💥';
      document.getElementById('mTitle').textContent = score >= 20 ? '霓虹大师！' : 'Game Over';
      document.getElementById('mPraise').textContent = getPraise();
      document.getElementById('mScore').textContent = score;
      document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
      if (score >= 20) { launchFireworks(document.getElementById('fw')); setTimeout(()=>launchFireworks(document.getElementById('fw')),400); }
      m.classList.add('show');
    }, 800);
  }

  canvas.addEventListener('click', jump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, {passive:false});
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); jump(); }
  });

  document.getElementById('mHome').onclick = () => location.href = 'index.html';
  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
  loop();
})();
</script>
</body>
