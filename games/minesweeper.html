<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
    user-select: none;
  }
  .app { width: 100%; max-width: 480px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; }
  .back-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #1a3a2a; padding: 7px 12px; border-radius: 20px; text-decoration: none; font-size: 0.82rem; }
  .game-title { color: #1a3a2a; font-size: 1.3rem; font-weight: 800; }
  .icon-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #1a3a2a; padding: 7px 10px; border-radius: 20px; cursor: pointer; font-size: 1rem; }

  .info-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .info-box {
    flex: 1;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
    color: #1a3a2a;
  }
  .info-label { font-size: 0.65rem; opacity: 0.7; }
  .info-val { font-size: 1.3rem; font-weight: 800; }

  .diff-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .diff-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 12px;
    background: rgba(255,255,255,0.2);
    color: #1a3a2a;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .diff-btn.active { background: #1a3a2a; color: #fff; }

  .board {
    display: grid;
    gap: 2px;
    background: rgba(0,0,0,0.15);
    padding: 6px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    margin: 0 auto;
  }
  .cell {
    aspect-ratio: 1;
    background: linear-gradient(135deg, #b8e6c8, #8fd3a8);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.1s;
    color: transparent;
  }
  .cell:active { transform: scale(0.92); }
  .cell.revealed { background: rgba(255,255,255,0.5); }
  .cell.mine { background: linear-gradient(135deg, #ff6b6b, #c92a2a); }
  .cell.flagged { color: #e74c3c; }
  .cell.n1 { color: #2980b9; }
  .cell.n2 { color: #27ae60; }
  .cell.n3 { color: #e74c3c; }
  .cell.n4 { color: #8e44ad; }
  .cell.n5 { color: #d35400; }
  .cell.n6 { color: #16a085; }
  .cell.n7 { color: #2c3e50; }
  .cell.n8 { color: #7f8c8d; }

  .controls { display: flex; gap: 10px; margin-top: 14px; }
  .ctrl-btn { flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,0.4); border-radius: 14px; background: rgba(255,255,255,0.2); color: #1a3a2a; font-weight: 600; cursor: pointer; }
  .ctrl-btn:hover { background: rgba(255,255,255,0.35); }
  .tip { text-align: center; color: rgba(26,58,42,0.7); font-size: 0.78rem; margin-top: 10px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal.show { display: flex; }
  .modal-box { background: linear-gradient(135deg, #11998e, #38ef7d); border: 1px solid rgba(255,255,255,0.4); border-radius: 24px; padding: 30px 24px; text-align: center; color: #1a3a2a; max-width: 340px; width: 100%; position: relative; overflow: hidden; }
  .modal-box h2 { font-size: 1.8rem; margin-bottom: 10px; }
  .modal-icon { font-size: 4rem; margin-bottom: 12px; }
  .modal-btn { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px; background: #1a3a2a; color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
  .modal-btn.secondary { background: rgba(255,255,255,0.4); color: #1a3a2a; margin-top: 8px; }
  .fw-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .praise { font-size: 1.2rem; color: #1a3a2a; font-weight: 800; margin: 8px 0; }

</head>
<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">💣 扫雷</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>

  <div class="info-row">
    <div class="info-box"><div class="info-label">💣 剩余</div><div class="info-val" id="mineCount">10</div></div>
    <div class="info-box"><div class="info-label">⏱️ 用时</div><div class="info-val" id="time">00:00</div></div>
    <div class="info-box"><div class="info-label">🏆 最好</div><div class="info-val" id="best">--</div></div>
  </div>

  <div class="diff-row">
    <button class="diff-btn active" data-size="9">初级 9×9</button>
    <button class="diff-btn" data-size="12">中级 12×12</button>
    <button class="diff-btn" data-size="16">高级 16×16</button>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="ctrl-btn" id="restartBtn">🔄 重新开始</button>
  </div>
  <p class="tip">🖱️ 左键翻开 · 右键标记旗帜 · 📱 长按标记</p>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">🎉</div>
    <h2 id="mTitle">胜利！</h2>
    <div class="praise" id="mPraise"></div>
    <p id="mMsg"></p>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>

<script src="js/common.js"></script>
<script>
(() => {
  const SIZES = {9: {n:9, mines:10}, 12: {n:12, mines:25}, 16: {n:16, mines:50}};
  let size = 9, mines = 10;
  let board = [], revealed = [], flagged = [];
  let firstClick = true, gameOver = false, won = false;
  let flagCount = 0, startTime = 0, timerInt = null;
  let bestTimes = JSON.parse(localStorage.getItem('mineBest') || '{}');

  const boardEl = document.getElementById('board');

  function init() {
    ({n: size, mines} = SIZES[size] || SIZES[9]);
    board = Array.from({length:size}, () => Array(size).fill(0));
    revealed = Array.from({length:size}, () => Array(size).fill(false));
    flagged = Array.from({length:size}, () => Array(size).fill(false));
    firstClick = true; gameOver = false; won = false; flagCount = 0;
    document.getElementById('mineCount').textContent = mines;
    stopTimer();
    document.getElementById('time').textContent = '00:00';
    document.getElementById('best').textContent = bestTimes[size] ? formatTime(bestTimes[size]) : '--';
    boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    render();
  }

  function placeMines(safeR, safeC) {
    let placed = 0;
    while (placed < mines) {
      const r = Math.floor(Math.random() * size);
      const c = Math.floor(Math.random() * size);
      if (board[r][c] === -1) continue;
      if (Math.abs(r-safeR) <= 1 && Math.abs(c-safeC) <= 1) continue;
      board[r][c] = -1;
      placed++;
    }
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (board[r][c] === -1) continue;
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r+dr, nc = c+dc;
        if (nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === -1) count++;
      }
      board[r][c] = count;
    }
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r; cell.dataset.c = c;
        if (revealed[r][c]) {
          cell.classList.add('revealed');
          if (board[r][c] === -1) { cell.classList.add('mine'); cell.textContent = '💣'; }
          else if (board[r][c] > 0) { cell.textContent = board[r][c]; cell.classList.add('n'+board[r][c]); }
        } else if (flagged[r][c]) {
          cell.classList.add('flagged');
          cell.textContent = '🚩';
        }
        cell.addEventListener('click', () => onLeft(r, c));
        cell.addEventListener('contextmenu', e => { e.preventDefault(); onRight(r, c); });
        // 长按标记
        let timer;
        cell.addEventListener('touchstart', () => { timer = setTimeout(() => onRight(r, c), 400); });
        cell.addEventListener('touchend', () => clearTimeout(timer));
        cell.addEventListener('touchmove', () => clearTimeout(timer));
        boardEl.appendChild(cell);
      }
    }
  }

  function onLeft(r, c) {
    if (gameOver || flagged[r][c] || revealed[r][c]) return;
    if (firstClick) {
      firstClick = false;
      placeMines(r, c);
      startTimer();
    }
    reveal(r, c);
    render();
    checkWin();
  }

  function onRight(r, c) {
    if (gameOver || revealed[r][c]) return;
    flagged[r][c] = !flagged[r][c];
    flagCount += flagged[r][c] ? 1 : -1;
    document.getElementById('mineCount').textContent = mines - flagCount;
    Sound.click();
    render();
  }

  function reveal(r, c) {
    if (r<0 || r>=size || c<0 || c>=size || revealed[r][c] || flagged[r][c]) return;
    revealed[r][c] = true;
    if (board[r][c] === -1) {
      gameOver = true;
      stopTimer();
      Sound.lose();
      // 显示所有雷
      for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) if (board[i][j] === -1) revealed[i][j] = true;
      render();
      setTimeout(showLose, 400);
      return;
    }
    Sound.select();
    if (board[r][c] === 0) {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        reveal(r+dr, c+dc);
      }
    }
  }

  function checkWin() {
    let unrevealed = 0;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (!revealed[r][c]) unrevealed++;
    if (unrevealed === mines) {
      won = true; gameOver = true;
      stopTimer();
      const t = getTime();
      if (!bestTimes[size] || t < bestTimes[size]) {
        bestTimes[size] = t;
        localStorage.setItem('mineBest', JSON.stringify(bestTimes));
      }
      User.addScore(t, true, t);
      Sound.win();
      showWin(t);
    }
  }

  function showWin(t) {
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = '🎉';
    document.getElementById('mTitle').textContent = '排雷成功！';
    document.getElementById('mPraise').textContent = getPraise();
    document.getElementById('mMsg').textContent = `用时 ${formatTime(t)}`;
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
    launchFireworks(document.getElementById('fw'));
    setTimeout(()=>launchFireworks(document.getElementById('fw')), 500);
    m.classList.add('show');
  }

  function showLose() {
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = '💥';
    document.getElementById('mTitle').textContent = '踩到雷了！';
    document.getElementById('mPraise').textContent = '小心一点，再试一次！';
    document.getElementById('mMsg').textContent = `用时 ${formatTime(getTime())}`;
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
    m.classList.add('show');
  }

  function startTimer() { startTime = Date.now(); timerInt = setInterval(() => document.getElementById('time').textContent = formatTime(getTime()), 1000); }
  function stopTimer() { if (timerInt) clearInterval(timerInt); }
  function getTime() { return Math.floor((Date.now() - startTime) / 1000); }

  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      size = +btn.dataset.size;
      init();
    };
  });
  document.getElementById('restartBtn').onclick = () => { Sound.click(); init(); };
  document.getElementById('mHome').onclick = () => location.href = 'index.html';

  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
})();
</script>
</body>
