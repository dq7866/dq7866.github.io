<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">🧱 打砖块</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>

  <div class="info-row">
    <div class="info-box"><div class="info-label">分数</div><div class="info-val" id="score">0</div></div>
    <div class="info-box"><div class="info-label">生命</div><div class="info-val" id="lives">❤️❤️❤️</div></div>
    <div class="info-box"><div class="info-label">关卡</div><div class="info-val" id="level">1</div></div>
  </div>

  <canvas id="game" width="320" height="420"></canvas>

  <div class="controls">
    <button class="ctrl-btn" id="startBtn">▶️ 开始</button>
    <button class="ctrl-btn" id="restartBtn">🔄 重开</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">🎯</div>
    <h2 id="mTitle">通关！</h2>
    <div class="praise" id="mPraise"></div>
    <div class="final-score" id="mScore">0 分</div>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>

<script src="js/common.js"></script>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const BRICK_ROWS = 6, BRICK_COLS = 8;
  const BRICK_W = (W - 20) / BRICK_COLS - 2;
  const BRICK_H = 18;
  const BRICK_TOP = 40, BRICK_LEFT = 10;

  const COLORS = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#ff9ff3','#54a0ff'];

  let bricks, ball, paddle, score, lives, level, running, gameOver, loopId;
  let ballLaunched = false;

  function init() {
    bricks = [];
    for (let r = 0; r < BRICK_ROWS; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        bricks.push({ x: BRICK_LEFT + c*(BRICK_W+2), y: BRICK_TOP + r*(BRICK_H+3), w: BRICK_W, h: BRICK_H, color: COLORS[r % COLORS.length], alive: true, hp: 1 });
      }
    }
    paddle = { x: W/2-40, y: H-25, w: 80, h: 12 };
    ball = { x: W/2, y: H-40, r: 7, dx: 0, dy: 0 };
    score = 0; lives = 3; level = 1;
    ballLaunched = false;
    gameOver = false;
    updateInfo();
    draw();
  }

  function updateInfo() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = '❤️'.repeat(lives) || '💀';
    document.getElementById('level').textContent = level;
  }

  function launchBall() {
    if (ballLaunched) return;
    ballLaunched = true;
    const angle = -Math.PI/2 + (Math.random()-0.5)*0.6;
    const speed = 5;
    ball.dx = Math.cos(angle)*speed;
    ball.dy = Math.sin(angle)*speed;
  }

  function loop() {
    if (!running || gameOver) return;
    if (ballLaunched) {
      ball.x += ball.dx;
      ball.y += ball.dy;
      // 墙壁反弹
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = -ball.dx; Sound.click(); }
      if (ball.x + ball.r > W) { ball.x = W-ball.r; ball.dx = -ball.dx; Sound.click(); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = -ball.dy; Sound.click(); }
      // 掉落
      if (ball.y + ball.r > H) {
        lives--;
        Sound.lose();
        if (lives <= 0) return endGame(false);
        ballLaunched = false;
        ball.x = paddle.x + paddle.w/2;
        ball.y = paddle.y - ball.r - 2;
        ball.dx = 0; ball.dy = 0;
      }
      // 挡板碰撞
      if (ball.y+ball.r >= paddle.y && ball.y-ball.r <= paddle.y+paddle.h &&
          ball.x >= paddle.x && ball.x <= paddle.x+paddle.w && ball.dy > 0) {
        const hit = (ball.x - paddle.x) / paddle.w; // 0~1
        const angle = -Math.PI/2 + (hit-0.5)*1.2;
        const speed = Math.hypot(ball.dx, ball.dy);
        ball.dx = Math.cos(angle)*speed;
        ball.dy = Math.sin(angle)*speed;
        ball.y = paddle.y - ball.r;
        Sound.select();
      }
      // 砖块碰撞
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x+ball.r > b.x && ball.x-ball.r < b.x+b.w &&
            ball.y+ball.r > b.y && ball.y-ball.r < b.y+b.h) {
          b.alive = false;
          score += 10 * level;
          Sound.match(1);
          // 判断反弹方向
          const prevX = ball.x - ball.dx, prevY = ball.y - ball.dy;
          if (prevX+ball.r <= b.x || prevX-ball.r >= b.x+b.w) ball.dx = -ball.dx;
          else ball.dy = -ball.dy;
          break;
        }
      }
      // 通关
      if (bricks.every(b => !b.alive)) return endGame(true);
    } else {
      ball.x = paddle.x + paddle.w/2;
      ball.y = paddle.y - ball.r - 2;
    }
    updateInfo();
    draw();
    loopId = requestAnimationFrame(loop);
  }

  function endGame(win) {
    gameOver = true;
    running = false;
    cancelAnimationFrame(loopId);
    if (win) {
      User.addScore(score, true, 0);
      Sound.win();
    } else {
      User.addScore(score, false, 0);
      Sound.lose();
    }
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = win ? '🏆' : '💥';
    document.getElementById('mTitle').textContent = win ? '通关！' : '游戏结束';
    document.getElementById('mPraise').textContent = win ? getPraise() : '再接再厉！';
    document.getElementById('mScore').textContent = score + ' 分';
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
    if (win) { launchFireworks(document.getElementById('fw')); setTimeout(()=>launchFireworks(document.getElementById('fw')),400); }
    m.classList.add('show');
  }

  function draw() {
    ctx.fillStyle = '#0a0e27';
    ctx.fillRect(0,0,W,H);
    // 砖块
    bricks.forEach(b => {
      if (!b.alive) return;
      const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
      g.addColorStop(0, b.color);
      g.addColorStop(1, shade(b.color, -30));
      ctx.fillStyle = g;
      roundRect(ctx, b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(b.x+2, b.y+2, b.w-4, 3);
    });
    // 挡板
    const pg = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y+paddle.h);
    pg.addColorStop(0, '#fff');
    pg.addColorStop(1, '#aaa');
    ctx.fillStyle = pg;
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();
    // 球
    const bg = ctx.createRadialGradient(ball.x-2, ball.y-2, 1, ball.x, ball.y, ball.r);
    bg.addColorStop(0, '#fff');
    bg.addColorStop(1, '#f5576c');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
  }

  function shade(color, percent) {
    const num = parseInt(color.slice(1),16);
    let r = (num>>16) + percent, g = ((num>>8)&0xff) + percent, b = (num&0xff) + percent;
    r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function movePaddle(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w/2));
  }

  canvas.addEventListener('mousemove', e => movePaddle(e.clientX));
  canvas.addEventListener('touchmove', e => { e.preventDefault(); movePaddle(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('click', () => running && launchBall());
  canvas.addEventListener('touchstart', e => { e.preventDefault(); movePaddle(e.touches[0].clientX); }, {passive:false});

  document.addEventListener('keydown', e => {
    if (!running) return;
    if (e.key === 'ArrowLeft') paddle.x = Math.max(0, paddle.x - 20);
    else if (e.key === 'ArrowRight') paddle.x = Math.min(W-paddle.w, paddle.x + 20);
    else if (e.key === ' ' || e.key === 'ArrowUp') launchBall();
  });

  function toggleStart() {
    Sound.click();
    if (gameOver) init();
    running = !running;
    if (running) {
      document.getElementById('startBtn').textContent = '⏸️ 暂停';
      if (!ballLaunched) launchBall();
      loop();
    } else {
      cancelAnimationFrame(loopId);
      document.getElementById('startBtn').textContent = '▶️ 继续';
    }
  }

  document.getElementById('startBtn').onclick = toggleStart;
  document.getElementById('restartBtn').onclick = () => { cancelAnimationFrame(loopId); running=false; init(); document.getElementById('startBtn').textContent='▶️ 开始'; };
  document.getElementById('mHome').onclick = () => location.href = 'index.html';

  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
})();
</script>
</body>
