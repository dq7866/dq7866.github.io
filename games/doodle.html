<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">🦘 涂鸦跳跃</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>
  <div class="info-row">
    <div class="info-box"><div class="info-label">分数</div><div class="info-val" id="score">0</div></div>
    <div class="info-box"><div class="info-label">最高</div><div class="info-val" id="best">0</div></div>
  </div>
  <canvas id="c" width="360" height="540"></canvas>
  <p class="tip">👆 倾斜/左右键 移动 · 踩平台向上跳 · 别掉下去！</p>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">🦘</div>
    <h2 id="mTitle">游戏结束</h2>
    <div class="praise" id="mPraise"></div>
    <div class="final-score" id="mScore">0</div>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GRAVITY = 0.35;
  const JUMP = -11;

  let player, platforms, score, best, gameOver, cameraY, moveDir;
  let highestY = 0;

  best = parseInt(localStorage.getItem('doodleBest')||'0');
  document.getElementById('best').textContent = best;

  const PLATFORM_COLORS = { normal: '#54a0ff', moving: '#feca57', break: '#ff6b6b', spring: '#26de81' };

  function init() {
    platforms = [];
    score = 0; gameOver = false; cameraY = 0; highestY = 0; moveDir = 0;
    player = { x: W/2, y: H - 100, vx: 0, vy: JUMP, w: 30, h: 30, face: 1 };
    // 初始平台
    for (let i = 0; i < 12; i++) {
      platforms.push(genPlatform(H - 60 - i * 70, i === 0));
    }
    updateInfo();
  }

  function genPlatform(y, forceNormal = false) {
    const w = 50 + Math.random() * 30;
    const x = Math.random() * (W - w);
    let type = 'normal';
    if (!forceNormal && y < H * 0.5) {
      const r = Math.random();
      if (r < 0.15) type = 'moving';
      else if (r < 0.25) type = 'break';
      else if (r < 0.32) type = 'spring';
    }
    return { x, y, w, h: 12, type, broken: false, dir: Math.random() > 0.5 ? 1 : -1 };
  }

  function updateInfo() {
    document.getElementById('score').textContent = Math.floor(score);
  }

  function update() {
    if (gameOver) return;
    // 水平移动
    player.x += player.vx;
    if (player.x < -player.w) player.x = W;
    if (player.x > W) player.x = -player.w;
    player.vx *= 0.9;
    if (moveDir) player.vx += moveDir * 0.5;

    // 重力
    player.vy += GRAVITY;
    player.y += player.vy;

    // 平台碰撞
    if (player.vy > 0) {
      for (const p of platforms) {
        if (p.broken) continue;
        if (player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy) {
          if (p.type === 'break') {
            p.broken = true;
            Sound.invalid();
          } else if (p.type === 'spring') {
            player.vy = JUMP * 1.6;
            Sound.combo(3);
          } else {
            player.vy = JUMP;
            Sound.select();
          }
          break;
        }
      }
    }

    // 移动平台
    platforms.forEach(p => {
      if (p.type === 'moving') {
        p.x += p.dir * 1.5;
        if (p.x < 0 || p.x + p.w > W) p.dir *= -1;
      }
    });

    // 相机跟随
    const targetCam = player.y - H * 0.4;
    if (targetCam < cameraY) {
      const diff = cameraY - targetCam;
      cameraY = targetCam;
      score += diff * 0.1;
      if (player.y < highestY) highestY = player.y;
      updateInfo();
    }

    // 生成/移除平台
    while (platforms.length < 15) {
      const topY = Math.min(...platforms.map(p => p.y));
      platforms.push(genPlatform(topY - 60 - Math.random() * 40));
    }
    platforms = platforms.filter(p => p.y < cameraY + H + 100);

    // 掉落死亡
    if (player.y > cameraY + H + 50) endGame();
  }

  function draw() {
    ctx.fillStyle = '#e8e3d3';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(0, -cameraY);

    // 平台
    platforms.forEach(p => {
      if (p.broken) return;
      ctx.fillStyle = PLATFORM_COLORS[p.type];
      roundRect(ctx, p.x, p.y, p.w, p.h, 5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(p.x, p.y, p.w, 3);
      if (p.type === 'spring') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(p.x + p.w/2 - 4, p.y - 6, 8, 6);
      }
    });

    // 玩家（涂鸦小人）
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    if (player.vx < -0.5) player.face = -1;
    else if (player.vx > 0.5) player.face = 1;
    ctx.scale(player.face, 1);
    // 身体
    ctx.fillStyle = '#54a0ff';
    ctx.beginPath();
    ctx.ellipse(0, 0, player.w/2, player.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-5, -3, 6, 0, Math.PI*2);
    ctx.arc(7, -3, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-3, -3, 3, 0, Math.PI*2);
    ctx.arc(9, -3, 3, 0, Math.PI*2);
    ctx.fill();
    // 嘴
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(2, 4, 5, 0, Math.PI);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function endGame() {
    gameOver = true;
    const s = Math.floor(score);
    if (s > best) { best = s; localStorage.setItem('doodleBest', best); document.getElementById('best').textContent = best; }
    User.addScore(s, false, 0);
    Sound.lose();
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = s >= 500 ? '🏆' : '🦘';
    document.getElementById('mTitle').textContent = s >= 500 ? '跳跃达人！' : '游戏结束';
    document.getElementById('mPraise').textContent = getPraise();
    document.getElementById('mScore').textContent = s;
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
    if (s >= 500) { launchFireworks(document.getElementById('fw')); setTimeout(()=>launchFireworks(document.getElementById('fw')),400); }
    m.classList.add('show');
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // 控制
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') moveDir = -1;
    else if (e.key === 'ArrowRight' || e.key === 'd') moveDir = 1;
  });
  document.addEventListener('keyup', e => {
    if (['ArrowLeft','a','ArrowRight','d'].includes(e.key)) moveDir = 0;
  });
  // 触摸控制：点击左/右半屏
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    moveDir = x < rect.width / 2 ? -1 : 1;
  }, {passive:false});
  canvas.addEventListener('touchend', e => { e.preventDefault(); moveDir = 0; }, {passive:false});
  canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    moveDir = e.clientX - rect.left < rect.width / 2 ? -1 : 1;
  });
  canvas.addEventListener('mouseup', () => { moveDir = 0; });

  document.getElementById('mHome').onclick = () => location.href = 'index.html';
  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
  loop();
})();
</script>
