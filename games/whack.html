<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #56ab2f, #a8e063);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
    user-select: none;
  }
  .app { width: 100%; max-width: 480px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; }
  .back-btn { background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); color: #2d5016; padding: 7px 12px; border-radius: 20px; text-decoration: none; font-size: 0.82rem; }
  .game-title { color: #2d5016; font-size: 1.3rem; font-weight: 800; }
  .icon-btn { background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); color: #2d5016; padding: 7px 10px; border-radius: 20px; cursor: pointer; font-size: 1rem; }
  .info-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .info-box { flex: 1; background: rgba(255,255,255,0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); border-radius: 12px; padding: 8px; text-align: center; color: #2d5016; }
  .info-label { font-size: 0.65rem; opacity: 0.7; }
  .info-val { font-size: 1.4rem; font-weight: 800; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    background: rgba(0,0,0,0.1);
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .hole {
    aspect-ratio: 1;
    background: radial-gradient(ellipse at center, #4a2c0a 0%, #2d1810 70%);
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: inset 0 6px 12px rgba(0,0,0,0.5);
  }
  .mole {
    position: absolute;
    bottom: -100%;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(2rem, 12vw, 3.5rem);
    transition: bottom 0.15s ease-out;
    pointer-events: none;
  }
  .hole.up .mole { bottom: 15%; }
  .hole.hit .mole { transform: translateX(-50%) scale(0.5); opacity: 0.3; }
  .controls { display: flex; gap: 10px; margin-top: 14px; }
  .ctrl-btn { flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,0.5); border-radius: 14px; background: rgba(255,255,255,0.25); color: #2d5016; font-weight: 600; cursor: pointer; }
  .ctrl-btn:hover { background: rgba(255,255,255,0.4); }
  .diff-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .diff-btn { flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.5); border-radius: 12px; background: rgba(255,255,255,0.25); color: #2d5016; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
  .diff-btn.active { background: #2d5016; color: #fff; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal.show { display: flex; }
  .modal-box { background: linear-gradient(135deg, #56ab2f, #a8e063); border: 1px solid rgba(255,255,255,0.5); border-radius: 24px; padding: 30px 24px; text-align: center; color: #2d5016; max-width: 340px; width: 100%; position: relative; overflow: hidden; }
  .modal-box h2 { font-size: 1.8rem; margin-bottom: 10px; }
  .modal-icon { font-size: 4rem; margin-bottom: 12px; }
  .modal-btn { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px; background: #2d5016; color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
  .modal-btn.secondary { background: rgba(255,255,255,0.4); color: #2d5016; margin-top: 8px; }
  .fw-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .praise { font-size: 1.2rem; color: #2d5016; font-weight: 800; margin: 8px 0; }
  .final-score { font-size: 2rem; font-weight: 900; color: #2d5016; margin: 10px 0; }
  .floating-score { position: fixed; pointer-events: none; font-size: 1.5rem; font-weight: 800; color: #ffd700; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); z-index: 9999; }

<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">🔨 打地鼠</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>
  <div class="info-row">
    <div class="info-box"><div class="info-label">分数</div><div class="info-val" id="score">0</div></div>
    <div class="info-box"><div class="info-label">连击</div><div class="info-val" id="combo">0</div></div>
    <div class="info-box"><div class="info-label">时间</div><div class="info-val" id="time">30</div></div>
  </div>
  <div class="diff-row">
    <button class="diff-btn active" data-speed="900">🐢 慢</button>
    <button class="diff-btn" data-speed="600">🐇 中</button>
    <button class="diff-btn" data-speed="350">⚡ 快</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button class="ctrl-btn" id="startBtn">▶️ 开始</button>
    <button class="ctrl-btn" id="restartBtn">🔄 重开</button>
  </div>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">🏆</div>
    <h2 id="mTitle">时间到！</h2>
    <div class="praise" id="mPraise"></div>
    <div class="final-score" id="mScore">0 分</div>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(() => {
  const HOLES = 9;
  let score = 0, combo = 0, maxCombo = 0;
  let timeLeft = 30, running = false;
  let moleInterval, timerInterval, speed = 900;
  let best = parseInt(localStorage.getItem('whackBest') || '0');
  const grid = document.getElementById('grid');
  let holes = [];

  function init() {
    grid.innerHTML = '';
    holes = [];
    for (let i = 0; i < HOLES; i++) {
      const hole = document.createElement('div');
      hole.className = 'hole';
      hole.innerHTML = '<div class="mole">🐹</div>';
      hole.onclick = () => whack(i);
      grid.appendChild(hole);
      holes.push(hole);
    }
    score = 0; combo = 0; maxCombo = 0; timeLeft = 30;
    running = false;
    updateInfo();
  }

  function updateInfo() {
    document.getElementById('score').textContent = score;
    document.getElementById('combo').textContent = combo;
    document.getElementById('time').textContent = timeLeft;
  }

  function popMole() {
    if (!running) return;
    // 随机选择一个空的洞
    const empty = holes.filter(h => !h.classList.contains('up'));
    if (empty.length === 0) return;
    const hole = empty[Math.floor(Math.random()*empty.length)];
    hole.classList.add('up');
    // 有概率出现金色地鼠（高分）
    const isGold = Math.random() < 0.1;
    hole.querySelector('.mole').textContent = isGold ? '⭐' : '🐹';
    hole.dataset.gold = isGold ? '1' : '0';
    setTimeout(() => hole.classList.remove('up'), speed * 0.8);
  }

  function whack(i) {
    if (!running) return;
    const hole = holes[i];
    if (!hole.classList.contains('up')) return;
    const isGold = hole.dataset.gold === '1';
    hole.classList.add('hit');
    hole.classList.remove('up');
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    const pts = (isGold ? 50 : 10) * (1 + Math.floor(combo/5) * 0.5);
    score += Math.floor(pts);
    Sound.match(Math.min(combo, 4));
    showFloat(hole, '+' + Math.floor(pts));
    setTimeout(() => hole.classList.remove('hit'), 200);
    updateInfo();
  }

  function showFloat(hole, text) {
    const rect = hole.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'floating-score';
    el.textContent = text;
    el.style.left = (rect.left + rect.width/2) + 'px';
    el.style.top = rect.top + 'px';
    document.body.appendChild(el);
    el.animate([
      { transform: 'translate(-50%,0)', opacity: 1 },
      { transform: 'translate(-50%,-40px)', opacity: 0 }
    ], { duration: 800, easing: 'ease-out' });
    setTimeout(() => el.remove(), 800);
  }

  function start() {
    if (running) return;
    running = true;
    moleInterval = setInterval(popMole, speed);
    timerInterval = setInterval(() => {
      timeLeft--;
      updateInfo();
      if (timeLeft <= 0) end();
    }, 1000);
    document.getElementById('startBtn').textContent = '⏸️ 暂停';
  }

  function end() {
    running = false;
    clearInterval(moleInterval);
    clearInterval(timerInterval);
    if (score > best) { best = score; localStorage.setItem('whackBest', best); }
    User.addScore(score, true, 30);
    Sound.win();
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = score >= 200 ? '🏆' : '🔨';
    document.getElementById('mTitle').textContent = score >= 200 ? '打地鼠大师！' : '时间到！';
    document.getElementById('mPraise').textContent = getPraise() + ` 最高连击 ${maxCombo}`;
    document.getElementById('mScore').textContent = score + ' 分';
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
    launchFireworks(document.getElementById('fw'));
    setTimeout(()=>launchFireworks(document.getElementById('fw')),400);
    m.classList.add('show');
  }

  document.querySelectorAll('.diff-btn').forEach(btn => btn.onclick = () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    speed = +btn.dataset.speed;
    if (running) { clearInterval(moleInterval); moleInterval = setInterval(popMole, speed); }
  });
  document.getElementById('startBtn').onclick = () => { Sound.click(); start(); };
  document.getElementById('restartBtn').onclick = () => {
    clearInterval(moleInterval); clearInterval(timerInterval);
    init();
    document.getElementById('startBtn').textContent = '▶️ 开始';
  };
  document.getElementById('mHome').onclick = () => location.href = 'index.html';

  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
})();
</script>
</body>
