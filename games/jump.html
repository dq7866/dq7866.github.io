<style>

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
  .back-btn { background: rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.1); color: #333; padding: 7px 12px; border-radius: 20px; text-decoration: none; font-size: 0.82rem; }

<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">👆 跳一跳</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>
  <div class="info-row">
    <div class="info-box"><div class="info-label">分数</div><div class="info-val" id="score">0</div></div>
    <div class="info-box"><div class="info-label">最高</div><div class="info-val" id="best">0</div></div>
  </div>
  <canvas id="c" width="380" height="480"></canvas>
  <div class="charge-bar"><div class="charge-fill" id="chargeFill"></div></div>
  <p class="tip">👆 长按蓄力 · 松手跳跃 · 落在平台中央得双倍分</p>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">💥</div>
    <h2 id="mTitle">游戏结束</h2>
    <div class="praise" id="mPraise"></div>
    <div class="final-score" id="mScore">0</div>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  let player, platforms, score, best, charging, chargeTime, jumping, gameOver, cameraY;
  let particles = [];
  best = parseInt(localStorage.getItem('jumpBest')||'0');
  document.getElementById('best').textContent = best;

  const COLORS = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#ff9ff3','#a55eea','#5f27cd','#ff9f43'];

  function init() {
    platforms = [];
    score = 0; charging = false; chargeTime = 0; jumping = false; gameOver = false;
    cameraY = 0;
    particles = [];
    // 初始平台
    platforms.push({ x: W/2-50, y: H-120, w: 100, color: COLORS[0] });
    platforms.push({ x: W/2+80, y: H-200, w: 80, color: COLORS[1] });
    player = { x: platforms[0].x + platforms[0].w/2, y: platforms[0].y - 30, vx: 0, vy: 0, onPlat: true, size: 16, rot: 0 };
    updateInfo();
  }

  function updateInfo() {
    document.getElementById('score').textContent = score;
  }

  function startCharge() {
    if (jumping || gameOver) return;
    charging = true;
    chargeTime = 0;
  }

  function releaseJump() {
    if (!charging || jumping || gameOver) return;
    charging = false;
    const power = Math.min(chargeTime, 60);
    const jumpPower = 8 + power * 0.25;
    // 朝向下一个平台方向跳
    const next = platforms[1];
    const dx = (next.x + next.w/2) - player.x;
    const dir = dx >= 0 ? 1 : -1;
    player.vx = dir * (2.5 + power * 0.1);
    player.vy = -jumpPower;
    player.onPlat = false;
    jumping = true;
    Sound.click();
  }

  function update(dt) {
    if (gameOver) return;
    if (charging) {
      chargeTime += dt;
      document.getElementById('chargeFill').style.width = Math.min(100, chargeTime/60*100) + '%';
      // 蓄力压缩效果
      player.size = 16 - Math.min(chargeTime, 60) * 0.1;
    }
    if (jumping) {
      player.vy += 0.5; // 重力
      player.x += player.vx;
      player.y += player.vy;
      player.rot += player.vx * 0.05;
      // 检查落地
      for (let i = 0; i < platforms.length; i++) {
        const p = platforms[i];
        if (player.vy > 0 &&
            player.x > p.x && player.x < p.x + p.w &&
            player.y + player.size/2 > p.y && player.y + player.size/2 < p.y + 20) {
          player.y = p.y - player.size/2;
          player.vy = 0; player.vx = 0;
          jumping = false;
          player.onPlat = true;
          player.size = 16;
          document.getElementById('chargeFill').style.width = '0%';
          // 计算是否落在平台中央
          const centerDist = Math.abs(player.x - (p.x + p.w/2));
          if (i === 1) {
            if (centerDist < 10) {
              score += 2; // 中心双倍
              Sound.combo(4);
              spawnParticles(player.x, player.y, '#ffd700');
            } else {
              score += 1;
              Sound.select();
            }
            // 生成下一个平台
            const last = platforms[platforms.length-1];
            const newW = 60 + Math.random()*50;
            const newX = last.x + (Math.random() > 0.5 ? 1 : -1) * (100 + Math.random()*80);
            const clampedX = Math.max(20, Math.min(W - newW - 20, newX));
            platforms.push({ x: clampedX, y: last.y - 80 - Math.random()*40, w: newW, color: COLORS[platforms.length % COLORS.length] });
            platforms.shift();
            updateInfo();
          }
          break;
        }
      }
      // 掉落失败
      if (player.y > H + 50) return endGame();
    }
    // 相机跟随
    const targetCam = player.y - H * 0.5;
    cameraY += (targetCam - cameraY) * 0.05;

    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--; });
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
      particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: -Math.random()*5-2, life: 30, color, size: 2+Math.random()*3 });
    }
  }

  function draw() {
    ctx.fillStyle = 'rgba(245,247,250,0.3)';
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(0, -cameraY);

    // 画平台
    platforms.forEach(p => {
      // 阴影
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(p.x + 3, p.y + 5, p.w, 30);
      // 平台
      const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y+30);
      g.addColorStop(0, p.color);
      g.addColorStop(1, shade(p.color, -30));
      ctx.fillStyle = g;
      roundRect(ctx, p.x, p.y, p.w, 30, 6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(p.x, p.y, p.w, 4);
    });

    // 画玩家
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.rot);
    // 小人（棋子样式）
    ctx.fillStyle = '#2d3436';
    ctx.beginPath();
    ctx.arc(0, -player.size, player.size*0.7, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(-player.size*0.5, -player.size, player.size, player.size*1.2);
    ctx.beginPath();
    ctx.ellipse(0, player.size*0.3, player.size*0.8, player.size*0.3, 0, 0, Math.PI*2);
    ctx.fill();
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-3, -player.size-2, 3, 0, Math.PI*2);
    ctx.arc(3, -player.size-2, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-3, -player.size-2, 1.5, 0, Math.PI*2);
    ctx.arc(3, -player.size-2, 1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // 粒子
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / 30;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function shade(color, percent) {
    const num = parseInt(color.slice(1),16);
    let r = (num>>16)+percent, g = ((num>>8)&0xff)+percent, b = (num&0xff)+percent;
    r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  function endGame() {
    gameOver = true;
    if (score > best) { best = score; localStorage.setItem('jumpBest', best); document.getElementById('best').textContent = best; }
    User.addScore(score * 100, false, 0);
    Sound.lose();
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = score >= 10 ? '🏆' : '💥';
    document.getElementById('mTitle').textContent = score >= 10 ? '跳跃大师！' : '游戏结束';
    document.getElementById('mPraise').textContent = getPraise();
    document.getElementById('mScore').textContent = score;
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
    m.classList.add('show');
  }

  let lastTime = 0;
  function loop(t) {
    const dt = (t - lastTime) / 16;
    lastTime = t;
    update(dt || 1);
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('mousedown', startCharge);
  canvas.addEventListener('mouseup', releaseJump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); startCharge(); }, {passive:false});
  canvas.addEventListener('touchend', e => { e.preventDefault(); releaseJump(); }, {passive:false});

  document.getElementById('mHome').onclick = () => location.href = 'index.html';
  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
