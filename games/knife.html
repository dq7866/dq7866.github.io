<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
    user-select: none;
    overflow: hidden;
  }
  .app { width: 100%; max-width: 420px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
  .back-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 7px 12px; border-radius: 20px; text-decoration: none; font-size: 0.82rem; }
  .game-title { color: #fff; font-size: 1.2rem; font-weight: 800; }
  .icon-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 7px 10px; border-radius: 20px; cursor: pointer; font-size: 1rem; }
  .info-row { display: flex; gap: 10px; margin-bottom: 8px; }
  .info-box { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 6px; text-align: center; color: #fff; }

  .info-val { font-size: 1.3rem; font-weight: 800; }
  canvas { display: block; margin: 0 auto; background: radial-gradient(circle at center, #1a1a2e, #0a0a1a); border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.4); touch-action: none; }
  .tip { text-align: center; color: rgba(255,255,255,0.4); font-size: 0.72rem; margin-top: 8px; }
  .knife-count { display: flex; justify-content: center; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .knife-dot { font-size: 1rem; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal.show { display: flex; }
  .modal-box { background: linear-gradient(135deg, #1a1a2e, #e94560); border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 30px 24px; text-align: center; color: #fff; max-width: 340px; width: 100%; position: relative; overflow: hidden; }
  .modal-box h2 { font-size: 1.6rem; margin-bottom: 10px; }
  .modal-icon { font-size: 4rem; margin-bottom: 12px; }
  .modal-btn { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg,#feca57,#ff9f43); color: #1a1a2e; font-weight: 800; font-size: 1rem; cursor: pointer; }
  .modal-btn.secondary { background: rgba(255,255,255,0.15); color: #fff; margin-top: 8px; }
  .fw-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .praise { font-size: 1.1rem; color: #feca57; font-weight: 800; margin: 8px 0; }
  .final-score { font-size: 2.2rem; font-weight: 900; color: #feca57; margin: 10px 0; }

<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">🔪 KNIFE HIT</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>
  <div class="info-row">
    <div class="info-box"><div class="info-label">关卡</div><div class="info-val" id="level">1</div></div>
    <div class="info-box"><div class="info-label">分数</div><div class="info-val" id="score">0</div></div>
    <div class="info-box"><div class="info-label">剩余</div><div class="info-val" id="remain">0</div></div>
  </div>
  <canvas id="c" width="380" height="520"></canvas>
  <div class="knife-count" id="knifeCount"></div>
  <p class="tip">👆 点击投掷飞刀 · 不要撞到已有飞刀</p>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">🔪</div>
    <h2 id="mTitle">过关！</h2>
    <div class="praise" id="mPraise"></div>
    <div class="final-score" id="mScore">0</div>
    <button class="modal-btn" id="mBtn">下一关</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const CX = W/2, CY = 180;
  const LOG_R = 55;

  let level, score, logAngle, logSpeed;
  let knives, flying, flyingProgress, gameOver;
  let remainKnives, particles = [];
  let best = parseInt(localStorage.getItem('knifeBest')||'0');

  function init(lv = 1) {
    level = lv;
    score = 0;
    logAngle = 0;
    logSpeed = 0.02 + level * 0.005;
    knives = [];
    flying = null;
    flyingProgress = 0;
    gameOver = false;
    remainKnives = 6 + level;
    // 随机预置几把刀
    const preset = Math.min(2, Math.floor(level/2));
    for (let i = 0; i < preset; i++) {
      knives.push({ angle: (Math.PI * 2 / preset) * i + Math.random()*0.3, y: LOG_R });
    }
    updateInfo();
    renderKnifeCount();
  }

  function updateInfo() {
    document.getElementById('level').textContent = level;
    document.getElementById('score').textContent = score;
    document.getElementById('remain').textContent = remainKnives - knives.filter(k=>k.stuck).length - (flying?1:0);
  }

  function renderKnifeCount() {
    const remaining = remainKnives - knives.filter(k=>k.stuck).length - (flying?1:0);
    document.getElementById('knifeCount').innerHTML = '🔪'.repeat(Math.max(0, remaining));
  }

  function throwKnife() {
    if (gameOver || flying || remainKnives <= 0) return;
    flying = { y: H - 60, target: CY + LOG_R };
    flyingProgress = 0;
    Sound.click();
  }

  function update() {
    if (gameOver) return;
    logAngle += logSpeed;
    if (flying) {
      flyingProgress += 0.12;
      flying.y = H - 60 - (flyingProgress * (H - 60 - (CY + LOG_R + 20)));
      if (flyingProgress >= 1) {
        // 检测是否撞到已有飞刀
        let hit = false;
        const knifeAngle = logAngle; // 投掷瞬间的角度
        for (const k of knives) {
          if (!k.stuck) continue;
          const diff = Math.abs(normalizeAngle(k.angle - knifeAngle));
          if (diff < 0.25) { hit = true; break; }
        }
        if (hit) {
          // 游戏结束
          gameOver = true;
          Sound.lose();
          spawnExplosion(CX, CY + LOG_R);
          setTimeout(() => showModal(false), 600);
        } else {
          knives.push({ angle: knifeAngle, y: LOG_R, stuck: true });
          score += 10;
          Sound.match(1);
          spawnParticles(CX, CY + LOG_R, '#feca57');
          remainKnives--;
          if (remainKnives <= 0) {
            gameOver = true;
            setTimeout(() => showModal(true), 400);
          }
        }
        flying = null;
        flyingProgress = 0;
        updateInfo();
        renderKnifeCount();
      }
    }
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--; });
  }

  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI*2;
    while (a < -Math.PI) a += Math.PI*2;
    return a;
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: -Math.random()*4-1, life: 25, color, size: 2+Math.random()*2 });
    }
  }

  function spawnExplosion(x, y) {
    for (let i = 0; i < 30; i++) {
      particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 40, color: ['#ff6b6b','#feca57','#fff'][Math.floor(Math.random()*3)], size: 3+Math.random()*3 });
    }
  }

  function draw() {
    ctx.fillStyle = 'rgba(10,10,26,0.4)';
    ctx.fillRect(0,0,W,H);

    // 木桩
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(logAngle);
    // 木头纹理
    const g = ctx.createRadialGradient(0, 0, 5, 0, 0, LOG_R);
    g.addColorStop(0, '#d4a574');
    g.addColorStop(0.5, '#b8860b');
    g.addColorStop(1, '#8b6914');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, LOG_R, 0, Math.PI*2);
    ctx.fill();
    // 年轮
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.arc(0, 0, LOG_R * i / 5, 0, Math.PI*2);
      ctx.stroke();
    }
    // 已插的飞刀
    knives.forEach(k => {
      if (!k.stuck) return;
      ctx.save();
      ctx.rotate(k.angle);
      ctx.translate(0, LOG_R - 5);
      // 刀柄
      ctx.fillStyle = '#2d3436';
      ctx.fillRect(-3, -35, 6, 20);
      // 护手
      ctx.fillStyle = '#636e72';
      ctx.fillRect(-7, -15, 14, 4);
      // 刀刃
      ctx.fillStyle = '#dfe6e9';
      ctx.beginPath();
      ctx.moveTo(-3, -11);
      ctx.lineTo(3, -11);
      ctx.lineTo(0, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });
    ctx.restore();

    // 飞行中的飞刀
    if (flying) {
      ctx.save();
      ctx.translate(CX, flying.y);
      ctx.fillStyle = '#2d3436';
      ctx.fillRect(-3, -35, 6, 20);
      ctx.fillStyle = '#636e72';
      ctx.fillRect(-7, -15, 14, 4);
      ctx.fillStyle = '#dfe6e9';
      ctx.beginPath();
      ctx.moveTo(-3, -11);
      ctx.lineTo(3, -11);
      ctx.lineTo(0, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 粒子
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / 40;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  function showModal(win) {
    if (win && score > best) { best = score; localStorage.setItem('knifeBest', best); }
    User.addScore(score, win, 0);
    if (win) Sound.win(); else Sound.lose();
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = win ? '🎉' : '💥';
    document.getElementById('mTitle').textContent = win ? '过关！' : '撞上了！';
    document.getElementById('mPraise').textContent = win ? getPraise() : '飞刀撞到了已有飞刀！';
    document.getElementById('mScore').textContent = score + ' 分';
    document.getElementById('mBtn').textContent = win ? '下一关 →' : '再来一局';
    document.getElementById('mBtn').onclick = () => {
      m.classList.remove('show');
      if (win) init(level + 1); else init(1);
    };
    if (win) { launchFireworks(document.getElementById('fw')); setTimeout(()=>launchFireworks(document.getElementById('fw')),400); }
    m.classList.add('show');
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('click', throwKnife);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); throwKnife(); }, {passive:false});
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); throwKnife(); }
  });

  document.getElementById('mHome').onclick = () => location.href = 'index.html';
  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
  loop();
})();
</script>
</body>
