<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; }
  .back-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #0a2818; padding: 7px 12px; border-radius: 20px; text-decoration: none; font-size: 0.82rem; }
  .game-title { color: #0a2818; font-size: 1.3rem; font-weight: 800; }
  .icon-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #0a2818; padding: 7px 10px; border-radius: 20px; cursor: pointer; font-size: 1rem; }

  .info-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .info-box { flex: 1; background: rgba(255,255,255,0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; padding: 8px; text-align: center; color: #0a2818; }
  .info-label { font-size: 0.65rem; opacity: 0.7; }
  .info-val { font-size: 1.4rem; font-weight: 800; }

  canvas {
    background: #0a2818;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    display: block;
    margin: 0 auto;
    touch-action: none;
  }

  .touch-ctrl {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
    max-width: 260px;
    margin-left: auto;
    margin-right: auto;
  }
  .t-btn {
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.4);
    color: #0a2818;
    padding: 16px;
    border-radius: 14px;
    font-size: 1.4rem;
    cursor: pointer;
    text-align: center;
  }
  .t-btn:active { background: rgba(255,255,255,0.45); }
  .t-btn.empty { visibility: hidden; }

  .controls { display: flex; gap: 10px; margin-top: 14px; }
  .ctrl-btn { flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,0.4); border-radius: 14px; background: rgba(255,255,255,0.2); color: #0a2818; font-weight: 600; cursor: pointer; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal.show { display: flex; }
  .modal-box { background: linear-gradient(135deg, #134e5e, #71b280); border: 1px solid rgba(255,255,255,0.4); border-radius: 24px; padding: 30px 24px; text-align: center; color: #0a2818; max-width: 340px; width: 100%; position: relative; overflow: hidden; }

  .modal-icon { font-size: 4rem; margin-bottom: 12px; }

  .modal-btn.secondary { background: rgba(255,255,255,0.4); color: #0a2818; margin-top: 8px; }

  .praise { font-size: 1.2rem; color: #0a2818; font-weight: 800; margin: 8px 0; }
  .final-score { font-size: 2rem; font-weight: 900; color: #0a2818; margin: 10px 0; }

<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">🐍 贪吃蛇</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>

  <div class="info-row">
    <div class="info-box"><div class="info-label">分数</div><div class="info-val" id="score">0</div></div>
    <div class="info-box"><div class="info-label">长度</div><div class="info-val" id="length">3</div></div>
    <div class="info-box"><div class="info-label">最高</div><div class="info-val" id="best">0</div></div>
  </div>

  <canvas id="game" width="320" height="320"></canvas>

  <div class="touch-ctrl">
    <div class="t-btn empty"></div>
    <button class="t-btn" data-dir="up">⬆️</button>
    <div class="t-btn empty"></div>
    <button class="t-btn" data-dir="left">⬅️</button>
    <button class="t-btn" data-dir="down">⬇️</button>
    <button class="t-btn" data-dir="right">➡️</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="startBtn">▶️ 开始</button>
    <button class="ctrl-btn" id="restartBtn">🔄 重开</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">💀</div>
    <h2 id="mTitle">游戏结束</h2>
    <div class="praise" id="mPraise"></div>
    <div class="final-score" id="mScore">0 分</div>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>

<script src="js/common.js"></script>
<script>
(() => {
  const COLS = 16, ROWS = 16, CELL = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  let snake, dir, nextDir, food, score, speed, running, gameOver, loopId;
  let best = parseInt(localStorage.getItem('snakeBest') || '0');
  document.getElementById('best').textContent = best;

  function init() {
    snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    speed = 150;
    gameOver = false;
    placeFood();
    updateInfo();
    draw();
  }

  function placeFood() {
    while (true) {
      food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
      if (!snake.some(s => s.x===food.x && s.y===food.y)) break;
    }
  }

  function updateInfo() {
    document.getElementById('score').textContent = score;
    document.getElementById('length').textContent = snake.length;
  }

  function step() {
    if (gameOver || !running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return endGame();
    // 撞自己
    if (snake.some(s => s.x===head.x && s.y===head.y)) return endGame();
    snake.unshift(head);
    if (head.x===food.x && head.y===food.y) {
      score += 10;
      Sound.match(1);
      placeFood();
      if (score % 50 === 0 && speed > 60) speed -= 10;
    } else {
      snake.pop();
    }
    updateInfo();
    draw();
    loopId = setTimeout(step, speed);
  }

  function endGame() {
    gameOver = true;
    running = false;
    clearTimeout(loopId);
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      document.getElementById('best').textContent = best;
    }
    User.addScore(score, false, 0);
    Sound.lose();
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = score >= 100 ? '🐍' : '💀';
    document.getElementById('mTitle').textContent = score >= 100 ? '贪吃大师！' : '游戏结束';
    document.getElementById('mPraise').textContent = getPraise();
    document.getElementById('mScore').textContent = score + ' 分';
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); init(); };
    m.classList.add('show');
  }

  function draw() {
    ctx.fillStyle = '#0a2818';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();}
    for (let i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();}
    // 食物
    const fx = food.x*CELL, fy = food.y*CELL;
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(fx+CELL/2, fy+CELL/2, CELL/2-2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(fx+CELL/2-3, fy+CELL/2-3, 3, 0, Math.PI*2);
    ctx.fill();
    // 蛇
    snake.forEach((s, i) => {
      const x = s.x*CELL, y = s.y*CELL;
      const t = i / snake.length;
      const g = Math.floor(180 - t*60);
      ctx.fillStyle = `rgb(80, ${g}, 120)`;
      roundRect(ctx, x+1, y+1, CELL-2, CELL-2, 5);
      ctx.fill();
      if (i === 0) {
        // 眼睛
        ctx.fillStyle = '#fff';
        const ex = dir.x, ey = dir.y;
        ctx.beginPath();
        ctx.arc(x+CELL/2+ex*4-ey*3, y+CELL/2+ey*4-ex*3, 2.5, 0, Math.PI*2);
        ctx.arc(x+CELL/2+ex*4+ey*3, y+CELL/2+ey*4+ex*3, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(x+CELL/2+ex*5-ey*3, y+CELL/2+ey*5-ex*3, 1.2, 0, Math.PI*2);
        ctx.arc(x+CELL/2+ex*5+ey*3, y+CELL/2+ey*5+ex*3, 1.2, 0, Math.PI*2);
        ctx.fill();
      }
    });
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function setDir(d) {
    const map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    const nd = map[d];
    if (!nd) return;
    if (nd.x === -dir.x && nd.y === -dir.y) return; // 不能反向
    nextDir = nd;
    Sound.click();
  }

  document.addEventListener('keydown', e => {
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right' };
    if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
  });

  document.querySelectorAll('.t-btn[data-dir]').forEach(btn => {
    btn.onclick = () => setDir(btn.dataset.dir);
  });

  // 滑动控制
  let touchStart = null;
  canvas.addEventListener('touchstart', e => { touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY}; });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
    touchStart = null;
  });

  function toggleStart() {
    Sound.click();
    if (gameOver) init();
    running = !running;
    if (running) {
      document.getElementById('startBtn').textContent = '⏸️ 暂停';
      step();
    } else {
      clearTimeout(loopId);
      document.getElementById('startBtn').textContent = '▶️ 继续';
    }
  }

  document.getElementById('startBtn').onclick = toggleStart;
  document.getElementById('restartBtn').onclick = () => { clearTimeout(loopId); running=false; init(); document.getElementById('startBtn').textContent='▶️ 开始'; };
  document.getElementById('mHome').onclick = () => location.href = 'index.html';

  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
})();
</script>
</body>
</html>
