<script>
(() => {
  const SIZE = 8;
  const GEM_COUNT = 6;
  const GEMS = ['🍎','🍊','🍋','🍇','🍓','🍉'];
  const GAME_KEY = 'fruit';
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const levelEl = document.getElementById('level');
  const timeEl = document.getElementById('time');
  const targetText = document.getElementById('targetText');
  const progressBar = document.getElementById('progressBar');
  const fwLayer = document.getElementById('fwLayer');

  let board = [];
  let score = 0;
  let moves = 30;
  let level = 1;
  let target = 1000;
  let selected = null;
  let busy = false;
  let startTime = Date.now();
  let timerInterval = null;
  let addMovesUsed = 0;
  const MAX_ADD_MOVES = 3;
  let bestScore = +localStorage.getItem(GAME_KEY + 'Best') || 0;

  function rand() { return Math.floor(Math.random() * GEM_COUNT); }
  function cell(r, c) { return { type: rand(), special: null }; }

  function initBoard() {
    board = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) {
        let g;
        do { g = cell(r, c); }
        while ((c >= 2 && row[c-1].type === g.type && row[c-2].type === g.type) ||
               (r >= 2 && board[r-1][c].type === g.type && board[r-2][c].type === g.type));
        row.push(g);
      }
      board.push(row);
    }
    if (!findHint()) shuffle(true);
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const g = board[r][c];
        const div = document.createElement('div');
        div.className = 'tile gem-' + g.type;
        if (g.special) div.classList.add('spec-' + g.special);
        div.textContent = GEMS[g.type];
        div.dataset.r = r;
        div.dataset.c = c;
        div.addEventListener('click', () => onTileClick(r, c));
        boardEl.appendChild(div);
      }
    }
  }

  function tileEl(r, c) { return boardEl.children[r * SIZE + c]; }

  function onTileClick(r, c) {
    if (busy) return;
    Sound.click();
    if (selected === null) {
      selected = { r, c };
      tileEl(r, c).classList.add('selected');
      Sound.select();
      return;
    }
    const { r: r0, c: c0 } = selected;
    tileEl(r0, c0).classList.remove('selected');
    if (r0 === r && c0 === c) { selected = null; return; }

    // 彩虹方块特殊处理：点击彩虹+任意方块，消除所有该颜色
    if (board[r0][c0].special === 'rainbow' || board[r][c].special === 'rainbow') {
      const rainbow = board[r0][c0].special === 'rainbow' ? {r:r0,c:c0} : {r,c};
      const other = board[r0][c0].special === 'rainbow' ? {r,c} : {r:r0,c:c0};
      selected = null;
      busy = true;
      moves--;
      movesEl.textContent = moves;
      triggerRainbow(rainbow, other);
      return;
    }

    const adj = (Math.abs(r-r0) + Math.abs(c-c0) === 1);
    if (adj) {
      swap(r0, c0, r, c);
      const matches = findMatches();
      if (matches.length > 0) {
        selected = null;
        busy = true;
        moves--;
        movesEl.textContent = moves;
        Sound.swap();
        resolve(matches, 1);
      } else {
        swap(r0, c0, r, c);
        Sound.invalid();
        animateSwap(r0, c0, r, c, () => {
          swap(r0, c0, r, c);
          render();
        });
        selected = null;
      }
    } else {
      selected = { r, c };
      tileEl(r, c).classList.add('selected');
      Sound.select();
    }
  }

  function triggerRainbow(rb, other) {
    const color = board[other.r][other.c].type;
    const toRemove = [{r:rb.r, c:rb.c}, {r:other.r, c:other.c}];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c].type === color) toRemove.push({r, c});
    const set = new Set(toRemove.map(p => p.r+','+p.c));
    const list = [...set].map(s => { const [r,c]=s.split(',').map(Number); return {r,c}; });
    Sound.match(3);
    resolve(list, 1);
  }

  function animateSwap(r0,c0,r1,c1,cb) {
    const a = tileEl(r0,c0), b = tileEl(r1,c1);
    const dx = (c1-c0), dy = (r1-r0);
    a.style.transition = 'transform 0.2s';
    b.style.transition = 'transform 0.2s';
    a.style.transform = `translate(${dx*100}%,${dy*100}%)`;
    b.style.transform = `translate(${-dx*100}%,${-dy*100}%)`;
    setTimeout(() => {
      a.style.transition = ''; b.style.transition = '';
      a.style.transform = ''; b.style.transform = '';
      cb && cb();
    }, 200);
  }

  function swap(r0,c0,r1,c1) {
    const t = board[r0][c0];
    board[r0][c0] = board[r1][c1];
    board[r1][c1] = t;
  }

  function findMatches() {
    const matched = Array.from({length:SIZE}, () => Array(SIZE).fill(false));
    const specials = Array.from({length:SIZE}, () => Array(SIZE).fill(null));
    // 横向
    for (let r = 0; r < SIZE; r++) {
      let run = 1;
      for (let c = 1; c <= SIZE; c++) {
        if (c < SIZE && board[r][c].type === board[r][c-1].type) { run++; }
        else {
          if (run >= 3) {
            for (let k = 0; k < run; k++) matched[r][c-1-k] = true;
            if (run === 4) specials[r][c-2] = 'row';
            else if (run >= 5) specials[r][c-3] = 'rainbow';
          }
          run = 1;
        }
      }
    }
    // 纵向
    for (let c = 0; c < SIZE; c++) {
      let run = 1;
      for (let r = 1; r <= SIZE; r++) {
        if (r < SIZE && board[r][c].type === board[r-1][c].type) { run++; }
        else {
          if (run >= 3) {
            for (let k = 0; k < run; k++) matched[r-1-k][c] = true;
            if (run === 4) specials[r-2][c] = 'col';
            else if (run >= 5) specials[r-3][c] = 'rainbow';
          }
          run = 1;
        }
      }
    }
    const list = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (matched[r][c]) list.push({r, c, special: specials[r][c]});
    return list;
  }

  function resolve(matches, combo) {
    let gained = matches.length * 10 * combo;
    score += gained;
    scoreEl.textContent = score;
    updateProgress();
    Sound.match(combo);
    if (combo >= 2) { showCombo(combo); Sound.combo(combo); }

    // 处理特殊方块效果
    const extraRemove = [];
    matches.forEach(({r, c, special}) => {
      const sp = board[r][c].special || special;
      if (sp === 'row') for (let cc = 0; cc < SIZE; cc++) extraRemove.push({r, c: cc});
      if (sp === 'col') for (let rr = 0; rr < SIZE; rr++) extraRemove.push({r: rr, c});
    });
    if (extraRemove.length) {
      const set = new Set(extraRemove.map(p => p.r+','+p.c));
      extraRemove.length = 0;
      set.forEach(s => { const [r,c]=s.split(',').map(Number); extraRemove.push({r,c}); });
      score += extraRemove.length * 5;
      scoreEl.textContent = score;
    }

    const allRemove = [...matches, ...extraRemove];
    const removeSet = new Map();
    allRemove.forEach(p => removeSet.set(p.r+','+p.c, p));
    const removeList = [...removeSet.values()];

    removeList.forEach(({r, c}) => {
      spawnParticles(r, c);
      const el = tileEl(r, c);
      if (el) el.classList.add('matched');
    });

    setTimeout(() => {
      removeList.forEach(({r, c}) => { board[r][c] = null; });
      collapse();
      render();
      boardEl.querySelectorAll('.tile').forEach(el => {
        if (el.dataset.falling === '1') el.classList.add('falling');
      });
      setTimeout(() => {
        const next = findMatches();
        if (next.length > 0) resolve(next, combo + 1);
        else {
          if (!findHint()) shuffle(false);
          busy = false;
          checkEnd();
        }
      }, 280);
    }, 400);
  }

  function collapse() {
    const isNew = Array.from({length:SIZE}, () => Array(SIZE).fill(false));
    for (let c = 0; c < SIZE; c++) {
      let write = SIZE - 1;
      for (let r = SIZE - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          board[write][c] = board[r][c];
          if (write !== r) isNew[write][c] = true;
          write--;
        }
      }
      for (let r = write; r >= 0; r--) {
        board[r][c] = cell();
        isNew[r][c] = true;
      }
    }
    boardEl.querySelectorAll('.tile').forEach((el, i) => {
      const r = Math.floor(i/SIZE), c = i%SIZE;
      if (isNew[r][c]) el.dataset.falling = '1';
    });
  }

  function showCombo(n) {
    const el = document.createElement('div');
    el.className = 'combo-text';
    el.textContent = `${n} 连击!`;
    document.querySelector('.board-wrap').appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function spawnParticles(r, c) {
    const wrap = document.querySelector('.board-wrap');
    const boardRect = boardEl.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    const cellW = boardRect.width / SIZE;
    const cx = boardRect.left - wrapRect.left + c * cellW + cellW/2;
    const cy = boardRect.top - wrapRect.top + r * cellW + cellW/2;
    for (let i = 0; i < 6; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 5 + Math.random() * 7;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = `hsl(${Math.random()*360},90%,65%)`;
      const ang = Math.random() * Math.PI * 2;
      const dist = 25 + Math.random() * 35;
      p.animate([
        { transform: 'translate(-50%,-50%)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px))`, opacity: 0 }
      ], { duration: 600, easing: 'ease-out' });
      wrap.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  function findHint() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE-1) {
          swap(r,c,r,c+1);
          if (findMatches().length) { swap(r,c,r,c+1); return [{r,c},{r,c:c+1}]; }
          swap(r,c,r,c+1);
        }
        if (r < SIZE-1) {
          swap(r,c,r+1,c);
          if (findMatches().length) { swap(r,c,r+1,c); return [{r,c},{r:r+1,c}]; }
          swap(r,c,r+1,c);
        }
      }
    }
    return null;
  }

  function shuffle(silent) {
    let attempts = 0;
    do {
      for (let i = board.length*board[0].length - 1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        const r1 = Math.floor(i/SIZE), c1 = i%SIZE;
        const r2 = Math.floor(j/SIZE), c2 = j%SIZE;
        [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
      }
      attempts++;
    } while ((findMatches().length || !findHint()) && attempts < 50);
    render();
    if (!silent) flashBoard();
  }

  function flashBoard() {
    boardEl.style.transition = 'opacity 0.3s';
    boardEl.style.opacity = '0.3';
    setTimeout(() => { boardEl.style.opacity = '1'; }, 200);
  }

  function updateProgress() {
    const pct = Math.min(100, (score / target) * 100);
    progressBar.style.width = pct + '%';
  }

  function startTimer() {
    startTime = Date.now();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const sec = Math.floor((Date.now() - startTime) / 1000);
      timeEl.textContent = formatTime(sec);
    }, 1000);
  }
  function stopTimer() { if (timerInterval) clearInterval(timerInterval); }
  function getTime() { return Math.floor((Date.now() - startTime) / 1000); }

  function checkEnd() {
    if (score >= target) {
      if (score > bestScore) { bestScore = score; localStorage.setItem(GAME_KEY + 'Best', bestScore); }
      stopTimer();
      User.addScore(score, true, getTime());
      Sound.win();
      showModal('win');
    } else if (moves <= 0) {
      if (score > bestScore) { bestScore = score; localStorage.setItem(GAME_KEY + 'Best', bestScore); }
      stopTimer();
      User.addScore(score, false, getTime());
      Sound.lose();
      showModal('lose');
    }
  }

  function showModal(type) {
    const m = document.getElementById('modal');
    const icon = document.getElementById('modalIcon');
    const title = document.getElementById('modalTitle');
    const praise = document.getElementById('modalPraise');
    const msg = document.getElementById('modalMsg');
    const sc = document.getElementById('modalScore');
    const mt = document.getElementById('modalTime');
    const best = document.getElementById('modalBest');
    const btn = document.getElementById('modalBtn');
    const modalFw = document.getElementById('modalFw');

    if (type === 'win') {
      icon.textContent = '🎉';
      title.textContent = '关卡完成！';
      praise.textContent = getPraise();
      msg.textContent = `恭喜通过第 ${level} 关！`;
      sc.textContent = score + ' 分';
      mt.textContent = `⏱️ 用时: ${formatTime(getTime())}`;
      best.textContent = `最高分: ${bestScore}`;
      btn.textContent = '下一关 →';
      btn.onclick = () => { m.classList.remove('show'); levelUp(); };
      launchFireworks(modalFw);
      setTimeout(() => launchFireworks(modalFw), 600);
    } else {
      icon.textContent = '😢';
      title.textContent = '步数用完了';
      praise.textContent = '差一点就成功了！';
      msg.textContent = `再试一次，你一定可以的！`;
      sc.textContent = score + ' 分';
      mt.textContent = `⏱️ 用时: ${formatTime(getTime())}`;
      best.textContent = `最高分: ${bestScore}`;
      btn.textContent = '再来一局';
      btn.onclick = () => { m.classList.remove('show'); restart(); };
    }
    m.classList.add('show');
  }

  function levelUp() {
    level++;
    target = Math.floor(target * 1.5);
    moves = 30;
    score = 0;
    addMovesUsed = 0;
    levelEl.textContent = level;
    movesEl.textContent = moves;
    scoreEl.textContent = score;
    targetText.textContent = `目标: ${target} 分`;
    initBoard();
    render();
    updateProgress();
    startTimer();
    Sound.levelup();
  }

  function restart() {
    score = 0; moves = 30; level = 1; target = 1000; addMovesUsed = 0;
    scoreEl.textContent = score;
    movesEl.textContent = moves;
    levelEl.textContent = level;
    targetText.textContent = `目标: ${target} 分`;
    initBoard();
    render();
    updateProgress();
    startTimer();
  }

  document.getElementById('hintBtn').onclick = () => {
    if (busy) return;
    Sound.click();
    const h = findHint();
    if (h) {
      h.forEach(({r,c}) => tileEl(r,c).classList.add('hint'));
      setTimeout(() => h.forEach(({r,c}) => tileEl(r,c)?.classList.remove('hint')), 1500);
    }
  };
  document.getElementById('addMovesBtn').onclick = () => {
    if (busy) return;
    if (addMovesUsed >= MAX_ADD_MOVES) return;
    addMovesUsed++;
    moves += 5;
    movesEl.textContent = moves;
    Sound.select();
    const btn = document.getElementById('addMovesBtn');
    btn.textContent = `➕ +5步 (${MAX_ADD_MOVES - addMovesUsed})`;
    if (addMovesUsed >= MAX_ADD_MOVES) btn.disabled = true;
  };
  document.getElementById('shuffleBtn').onclick = () => { if (!busy) { Sound.click(); shuffle(false); } };
  document.getElementById('restartBtn').onclick = () => { Sound.click(); restart(); };
  document.getElementById('modalHome').onclick = () => location.href = 'index.html';

  const soundBtn = document.getElementById('soundBtn');
  function updateSoundBtn() {
    soundBtn.textContent = Sound.isEnabled() ? '🔊' : '🔇';
  }
  updateSoundBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on);
    updateSoundBtn();
    if (on) { Sound.resume(); Sound.startBGM(); }
    else Sound.stopBGM();
  };

  initBoard();
  render();
  updateProgress();
  startTimer();
})();
</script>
</body>
</html>
