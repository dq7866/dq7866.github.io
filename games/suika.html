<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #2d1b4e 0%, #1a1a2e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
    user-select: none;
    overflow: hidden;
  }
  .app { width: 100%; max-width: 420px; position: relative; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
  .back-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 7px 12px; border-radius: 20px; text-decoration: none; font-size: 0.82rem; }
  .game-title { color: #fff; font-size: 1.2rem; font-weight: 800; }
  .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 7px 10px; border-radius: 20px; cursor: pointer; font-size: 1rem; }
  .info-row { display: flex; gap: 10px; margin-bottom: 8px; }
  .info-box { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 6px; text-align: center; color: #fff; }
  .info-label { font-size: 0.6rem; opacity: 0.6; }
  .info-val { font-size: 1.2rem; font-weight: 800; }
  #c { display: block; margin: 0 auto; background: linear-gradient(180deg, #1a0a2e, #16213e); border-radius: 16px; box-shadow: 0 0 40px rgba(255,255,255,0.05); touch-action: none; }
  .evolve-bar { display: flex; gap: 2px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
  .evolve-dot { width: 18px; height: 18px; border-radius: 50; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; opacity: 0.4; transition: all 0.3s; }
  .evolve-dot.unlocked { opacity: 1; transform: scale(1.1); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal.show { display: flex; }
  .modal-box { background: linear-gradient(135deg, #2d1b4e, #6a0572); border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 30px 24px; text-align: center; color: #fff; max-width: 340px; width: 100%; position: relative; overflow: hidden; }
  .modal-box h2 { font-size: 1.6rem; margin-bottom: 10px; }
  .modal-icon { font-size: 4rem; margin-bottom: 12px; }
  .modal-btn { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg,#f093fb,#f5576c); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
  .modal-btn.secondary { background: rgba(255,255,255,0.15); color: #fff; margin-top: 8px; }
  .fw-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .praise { font-size: 1.1rem; color: #f093fb; font-weight: 800; margin: 8px 0; }
  .final-score { font-size: 2rem; font-weight: 900; color: #ffd700; margin: 10px 0; }
  .tip { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.72rem; margin-top: 6px; }

<body>
<div class="app">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <div class="game-title">🍉 合成大西瓜</div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>
  <div class="info-row">
    <div class="info-box"><div class="info-label">分数</div><div class="info-val" id="score">0</div></div>
    <div class="info-box"><div class="info-label">最大</div><div class="info-val" id="best">0</div></div>
    <div class="info-box"><div class="info-label">下一个</div><div class="info-val" id="nextFruit">🍇</div></div>
  </div>
  <canvas id="c" width="380" height="480"></canvas>
  <p class="tip">👆 左右移动瞄准 · 松手投放 · 相同水果合成升级</p>
  <div class="evolve-bar" id="evoBar"></div>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="fw-layer" id="fw"></div>
    <div class="modal-icon" id="mIcon">🍉</div>
    <h2 id="mTitle">合成大西瓜！</h2>
    <div class="praise" id="mPraise"></div>
    <div class="final-score" id="mScore">0 分</div>
    <button class="modal-btn" id="mBtn">再来一局</button>
    <button class="modal-btn secondary" id="mHome">返回首页</button>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/matter.min.js"></script>
<script>
(() => {
  const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
  const canvas = document.getElementById('c');
  const W = canvas.width, H = canvas.height;
  const WALL = 20;

  // 水果定义：emoji, 半径, 颜色, 分数
  const FRUITS = [
    { e: '🍒', r: 14, c: '#ff4757', s: 1 },
    { e: '🍓', r: 19, c: '#ff6b81', s: 3 },
    { e: '🍇', r: 25, c: '#a55eea', s: 6 },
    { e: '🍊', r: 32, c: '#ffa502', s: 10 },
    { e: '🍋', r: 40, c: '#ffd93d', s: 15 },
    { e: '🍍', r: 50, c: '#feca57', s: 21 },
    { e: '🍎', r: 62, c: '#ee5a6f', s: 28 },
    { e: '🍉', r: 78, c: '#ff6348', s: 100 },
  ];

  let engine, render, runner;
  let score = 0, best = parseInt(localStorage.getItem('suikaBest')||'0');
  let currentFruit = 0, nextFruitIdx = 0;
  let mouseX = W/2, canDrop = true, gameOver = false;
  let unlocked = new Set([0]);
  let dropLine = 60;

  document.getElementById('best').textContent = best;

  function init() {
    score = 0; gameOver = false; canDrop = true; unlocked = new Set([0]);
    currentFruit = Math.floor(Math.random()*2);
    nextFruitIdx = Math.floor(Math.random()*2);
    updateInfo();
    renderEvoBar();

    engine = Engine.create({ gravity: { x:0, y:1.2 } });
    render = Render.create({
      canvas, engine,
      options: { width: W, height: H, wireframes: false, background: 'transparent' }
    });
    // 墙壁（用自定义渲染）
    const wallOpts = { isStatic: true, render: { fillStyle: '#2d1b4e' } };
    Composite.add(engine.world, [
      Bodies.rectangle(W/2, H+WALL/2, W, WALL, wallOpts), // 底
      Bodies.rectangle(WALL/2, H/2, WALL, H, wallOpts), // 左
      Bodies.rectangle(W-WALL/2, H/2, WALL, H, wallOpts), // 右
    ]);
    Render.run(render);
    runner = Runner.create();
    Runner.run(runner, engine);

    // 碰撞检测
    Events.on(engine, 'collisionStart', (e) => {
      e.pairs.forEach(pair => {
        const a = pair.bodyA, b = pair.bodyB;
        if (a.fruitIdx === undefined || b.fruitIdx === undefined) return;
        if (a.fruitIdx !== b.fruitIdx) return;
        if (a.merging || b.merging) return;
        if (a.fruitIdx >= FRUITS.length - 1) return;
        a.merging = true; b.merging = true;
        const mx = (a.position.x + b.position.x) / 2;
        const my = (a.position.y + b.position.y) / 2;
        Composite.remove(engine.world, a);
        Composite.remove(engine.world, b);
        const newIdx = a.fruitIdx + 1;
        const f = FRUITS[newIdx];
        const nb = Bodies.circle(mx, my, f.r, {
          restitution: 0.3, friction: 0.5,
          render: { fillStyle: f.c }
        });
        nb.fruitIdx = newIdx;
        Composite.add(engine.world, nb);
        score += f.s;
        unlocked.add(newIdx);
        Sound.match(Math.min(newIdx+1, 4));
        if (newIdx >= 4) Sound.levelup();
        if (newIdx === FRUITS.length - 1) {
          // 合成大西瓜！
          setTimeout(() => win(), 500);
        }
        updateInfo();
        renderEvoBar();
      });
    });

    // 检测游戏结束（水果超出线）
    Events.on(engine, 'afterUpdate', () => {
      if (gameOver) return;
      const bodies = Composite.allBodies(engine.world);
      for (const b of bodies) {
        if (b.fruitIdx === undefined) continue;
        if (b.position.y - b.circleRadius < dropLine - 5 && Math.abs(b.velocity.y) < 0.5) {
          // 容许稍微停顿
          if (!b._overLine) b._overLine = Date.now();
          else if (Date.now() - b._overLine > 2000) { endGame(); return; }
        } else {
          b._overLine = null;
        }
      }
    });

    drawPreview();
  }

  function drawPreview() {
    // 在 canvas 上方画预览水果（覆盖在 render 上）
    requestAnimationFrame(() => {
      const ctx = canvas.getContext('2d');
      // Matter render 已经管理 ctx，我们用 Events.afterRender
    });
  }

  // 用 afterRender 画预览水果和掉落线
  Events.on({}, 'afterRender', () => {});
  // 用 Matter Render 的事件
  if (render) {
    Events.on(render, 'afterRender', () => {
      const ctx = canvas.getContext('2d');
      // 掉落线
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(WALL, dropLine);
      ctx.lineTo(W - WALL, dropLine);
      ctx.stroke();
      ctx.setLineDash([]);
      // 预览水果
      if (canDrop && !gameOver) {
        const f = FRUITS[currentFruit];
        ctx.font = `${f.r*1.8}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.e, mouseX, dropLine - 10);
      }
    });
  }

  function drop() {
    if (!canDrop || gameOver) return;
    canDrop = false;
    const f = FRUITS[currentFruit];
    const body = Bodies.circle(mouseX, dropLine + f.r, f.r, {
      restitution: 0.3, friction: 0.5,
      render: { fillStyle: f.c }
    });
    body.fruitIdx = currentFruit;
    Composite.add(engine.world, body);
    Sound.click();
    currentFruit = nextFruitIdx;
    nextFruitIdx = Math.floor(Math.random()*2);
    updateInfo();
    setTimeout(() => { if (!gameOver) canDrop = true; }, 400);
  }

  function updateInfo() {
    document.getElementById('score').textContent = score;
    document.getElementById('nextFruit').textContent = FRUITS[currentFruit].e;
  }

  function renderEvoBar() {
    const bar = document.getElementById('evoBar');
    bar.innerHTML = FRUITS.map((f, i) =>
      `<div class="evolve-dot${unlocked.has(i)?' unlocked':''}" style="background:${unlocked.has(i)?f.c:'rgba(255,255,255,0.1)'};border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;">${f.e}</div>`
    ).join('');
  }

  function win() {
    gameOver = true;
    if (score > best) { best = score; localStorage.setItem('suikaBest', best); }
    User.addScore(score, true, 0);
    Sound.win();
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = '🍉';
    document.getElementById('mTitle').textContent = '合成大西瓜！';
    document.getElementById('mPraise').textContent = getPraise();
    document.getElementById('mScore').textContent = score + ' 分';
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); cleanup(); init(); };
    launchFireworks(document.getElementById('fw'));
    setTimeout(()=>launchFireworks(document.getElementById('fw')),400);
    m.classList.add('show');
  }

  function endGame() {
    gameOver = true;
    if (score > best) { best = score; localStorage.setItem('suikaBest', best); }
    document.getElementById('best').textContent = best;
    User.addScore(score, false, 0);
    Sound.lose();
    const m = document.getElementById('modal');
    document.getElementById('mIcon').textContent = '💥';
    document.getElementById('mTitle').textContent = '游戏结束';
    document.getElementById('mPraise').textContent = '水果溢出啦！';
    document.getElementById('mScore').textContent = score + ' 分';
    document.getElementById('mBtn').onclick = () => { m.classList.remove('show'); cleanup(); init(); };
    m.classList.add('show');
  }

  function cleanup() {
    if (runner) Runner.stop(runner);
    if (render) Render.stop(render);
    if (engine) Engine.clear(engine);
  }

  // 控制
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = Math.max(WALL+15, Math.min(W-WALL-15, (e.clientX-rect.left)*(W/rect.width)));
  });
  canvas.addEventListener('click', drop);
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    mouseX = Math.max(WALL+15, Math.min(W-WALL-15, (e.touches[0].clientX-rect.left)*(W/rect.width)));
  }, {passive:false});
  canvas.addEventListener('touchend', e => { e.preventDefault(); drop(); }, {passive:false});

  document.getElementById('mHome').onclick = () => location.href = 'index.html';
  const soundBtn = document.getElementById('soundBtn');
  function updBtn(){ soundBtn.textContent = Sound.isEnabled()?'🔊':'🔇'; }
  updBtn();
  soundBtn.onclick = () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); updBtn();
    if (on) Sound.startBGM(); else Sound.stopBGM();
  };

  init();
})();
</script>
</body>
