<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>游戏中 · 巧手拆装工坊 3D</title>
<link rel="stylesheet" href="style3d.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body class="phase-dis">

<header class="g-top">
  <a class="ib" id="backBtn" href="index.html" aria-label="返回大厅">
    <svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
  </a>
  <div class="g-title">
    <div class="t-row1">
      <h1 id="toyName">玩具</h1>
      <span class="pill lv" id="levelPill">简单级</span>
      <span class="pill trial" id="trialPill" hidden>试玩 · 不计成绩</span>
    </div>
    <div class="t-row2">
      <span class="pill" id="phasePill">第一步 · 拆一拆</span>
      <span class="pill clock" id="timerPill" hidden>00:00</span>
      <span class="pill prog" id="progressPill">0/0</span>
      <span class="pill extra" id="extraPill" hidden></span>
      <span class="pill user" id="userTag"></span>
    </div>
  </div>
  <div class="g-tools">
    <button class="ib th" id="hintBtn" aria-label="提示">💡 提示 <b id="hintCount">3</b></button>
    <button class="ib th" id="listBtn" aria-label="零件清单">清单</button>
    <button class="ib" id="stepsBtn" aria-label="拆解步骤">
      <svg viewBox="0 0 24 24"><path d="M10 12h11"/><path d="M10 18h11"/><path d="M10 6h11"/><path d="M4 10h2"/><path d="M4 6h1v4"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
    </button>
  </div>
</header>

<main class="g-main">
  <div class="stage-wrap" id="stageWrap">
    <canvas id="scene"></canvas>

    <div class="stage-tools">
      <button class="ib th" id="xrayBtn" aria-label="透视">透视</button>
      <button class="ib th" id="resetBtn" aria-label="视角回正">回正</button>
    </div>

    <button class="auto-btn" id="autoBtn" aria-label="自动旋转">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      自动旋转
    </button>
    <div class="stage-tip">单指拖动旋转 · 双指缩放</div>

    <div class="pick-tip" id="pickTip" hidden></div>

    <!-- 拧合手势提示 -->
    <div class="twist" id="twist">
      <div class="twist-txt" id="twistText"></div>
      <div class="twist-track"><i id="twistFill"></i></div>
      <button class="twist-skip" id="twistSkip">跳过（记 1 次失误）</button>
    </div>

    <!-- 零件清单（与 3D 双向联动） -->
    <aside class="list-panel" id="listPanel">
      <div class="lp-head">
        <b>零件清单</b>
        <span id="listCount">0/0</span>
        <button class="lp-x" id="listClose" aria-label="收起">×</button>
      </div>
      <p class="lp-tip">悬停或点按清单项，模型里会亮起对应零件</p>
      <div class="pl-body" id="partList"></div>
    </aside>
  </div>

  <div class="hint-bar">
    <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="26" r="16" fill="#FFC53D" stroke="#3D2C1E" stroke-width="3.5"/>
      <circle cx="26" cy="24" r="2.4" fill="#3D2C1E"/>
      <circle cx="38" cy="24" r="2.4" fill="#3D2C1E"/>
      <path d="M26 31 Q32 36 38 31" stroke="#3D2C1E" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <rect x="24" y="42" width="16" height="16" rx="7" fill="#FF7A45" stroke="#3D2C1E" stroke-width="3.5"/>
    </svg>
    <div class="bubble" id="bubble" aria-live="polite">准备开始！</div>
  </div>

  <div class="tray-wrap">
    <div class="tray-head"><span class="tray-label" id="trayLabel">零件架</span></div>
    <div class="tray" id="tray"></div>
  </div>
</main>

<!-- 完成弹窗 -->
<div class="mask" id="doneModal">
  <div class="modal">
    <button class="x" id="doneClose" aria-label="关闭">×</button>
    <div class="done-stars" id="doneStars"></div>
    <h2 id="doneTitle">完成啦！</h2>
    <p class="sub" id="doneSub"></p>
    <p class="score" id="doneScore" hidden></p>
    <p class="done-best" id="doneBest"></p>
    <div id="doneAch"></div>
    <div class="actions">
      <a class="btn primary" id="nextBtn" href="index.html">下一个玩具</a>
      <button class="btn" id="retryBtn">再玩一次</button>
      <a class="btn ghost" id="doneHome" href="index.html">回大厅</a>
    </div>
  </div>
</div>

<!-- 步骤弹窗 -->
<div class="mask" id="stepsModal">
  <div class="modal">
    <button class="x" id="stepsClose" aria-label="关闭">×</button>
    <h2>拆解步骤</h2>
    <p class="sub">从外到内拆，装回去时倒着来</p>
    <ol class="steps" id="stepsList"></ol>
  </div>
</div>

<script type="module" src="./js3d/game.js"></script>
</body>
</html>
