<!DOCTYPE html>
<!-- daily.glb 分块调试查看器：每个部件随机高对比色，便于校准切割面 -->
<html>
<head><meta charset="utf-8"><style>body{margin:0;background:#202830}#info{color:#fff;font:12px monospace;position:fixed;top:4px;left:8px}</style></head>
<body>
<div id="info">loading…</div>
<script type="module">
import * as THREE from '../lib/three.module.js';
import { GLTFLoader } from '../lib/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202830);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 20);
camera.position.set(0, 1.0, 3.4);
camera.lookAt(0, 0.85, 0);
scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(2, 4, 5); scene.add(dl);
const dr = new THREE.DirectionalLight(0xffffff, 0.8); dr.position.set(-3, 2, -4); scene.add(dr);

const PALETTE = ['#e6194b','#3cb44b','#ffe119','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#bcf60c','#008080','#9a6324','#800000','#808000','#000075','#808080','#ffffff','#ffd8b1','#aaffc3'];
const REAL = new URLSearchParams(location.search).has('real'); // ?real=1 用顶点色真实观感
let i = 0;
window.__parts = [];
window.__meshes = {};
new GLTFLoader().parse(await (await fetch('../assets/daily.glb')).arrayBuffer(), '', (g) => {
  g.scene.traverse(o => {
    if (!o.isMesh) return;
    window.__meshes[o.name] = o;
    const c = new THREE.Color(PALETTE[i % PALETTE.length]);
    o.material = REAL
      ? new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.62, side: THREE.DoubleSide })
      : new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 });
    window.__parts.push({ id: o.name, pos: o.position.toArray().map(v => +v.toFixed(3)), tris: (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3 });
    o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox, t = o.position;
    window.__parts[window.__parts.length - 1].box = {
      min: [b.min.x + t.x, b.min.y + t.y, b.min.z + t.z].map(v => +v.toFixed(3)),
      max: [b.max.x + t.x, b.max.y + t.y, b.max.z + t.z].map(v => +v.toFixed(3)),
    };
    i++;
  });
  scene.add(g.scene);
  window.__scene = scene;
  document.getElementById('info').textContent = window.__parts.map(p => `${p.id} ${p.tris}tri y${p.box.min[1]}~${p.box.max[1]}`).join(' | ');
  window.__ready = true;
});
renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.__cam = camera;
window.__renderer = renderer;
window.__THREE = THREE;
</script>
</body>
</html>
