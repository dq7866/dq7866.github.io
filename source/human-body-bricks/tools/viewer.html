<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>模型检查</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1420; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 12px; color: #cfe3ff; font: 12px/1.6 ui-monospace, monospace; white-space: pre; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from '../lib/three.module.js';
import { GLTFLoader } from '../lib/GLTFLoader.js';
import { MeshoptDecoder } from '../lib/meshopt_decoder.module.js';

const params = new URLSearchParams(location.search);
// 默认看运行时的烘焙产物；加 ?src=1 看原始数据集
const file = params.get('f') || (params.get('src') ? 'source/ecorche.glb' : 'body.glb');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1420);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 200);
const hemi = new THREE.HemisphereLight(0xbcd7ff, 0x1a2233, 1.4);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0dc, 2.2);
key.position.set(3, 6, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6fb7e8, 1.2);
rim.position.set(-5, 3, -6);
scene.add(rim);

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
loader.load(`../assets/${file}`, gltf => {
  const root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);

  let meshes = 0, tris = 0;
  root.traverse(o => {
    if (!o.isMesh) return;
    meshes++;
    const g = o.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });

  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const h = Math.max(size.x, size.y, size.z);

  camera.position.set(c.x + h * 0.9, c.y + h * 0.25, c.z + h * 1.4);
  camera.lookAt(c);
  camera.near = h / 500;
  camera.far = h * 20;
  camera.updateProjectionMatrix();

  document.getElementById('hud').textContent =
    `${file}\n网格 ${meshes}  三角形 ${Math.round(tris).toLocaleString()}` +
    `\n包围盒 ${size.toArray().map(v => v.toFixed(3)).join(' × ')}` +
    `\n中心 ${c.toArray().map(v => v.toFixed(3)).join(', ')}`;

  // ---- 诊断探针 ----
  const rows = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry;
    g.computeBoundingBox();
    const wb = g.boundingBox.clone().applyMatrix4(o.matrixWorld);
    const s = wb.getSize(new THREE.Vector3());
    const maxS = Math.max(s.x, s.y, s.z);
    rows.push({
      name: o.name,
      maxS: +maxS.toFixed(3),
      box: [wb.min.toArray().map(v => +v.toFixed(2)), wb.max.toArray().map(v => +v.toFixed(2))],
      containsCam: wb.containsPoint(camera.position),
      interleaved: !!(g.attributes.position && g.attributes.position.isInterleavedBufferAttribute),
      rawRange: (() => {
        const a = g.attributes.position;
        if (!a) return null;
        let mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
        const n = Math.min(a.count, 6000);
        for (let i = 0; i < n; i++) {
          mn[0] = Math.min(mn[0], a.getX(i)); mx[0] = Math.max(mx[0], a.getX(i));
          mn[1] = Math.min(mn[1], a.getY(i)); mx[1] = Math.max(mx[1], a.getY(i));
          mn[2] = Math.min(mn[2], a.getZ(i)); mx[2] = Math.max(mx[2], a.getZ(i));
        }
        return [mn.map(v => +v.toFixed(1)), mx.map(v => +v.toFixed(1))];
      })(),
    });
  });
  rows.sort((a, b) => b.maxS - a.maxS);
  window.__V = { THREE, scene, camera, root, rows, render: () => renderer.render(scene, camera) };
  console.log('TOP>>' + JSON.stringify(rows.slice(0, 12)));

  renderer.render(scene, camera);
}, undefined, err => {
  document.getElementById('hud').textContent = '加载失败: ' + err;
});
</script>
</body>
</html>
