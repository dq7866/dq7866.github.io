<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题库后台 · 知识擂台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
:root{
  --bg:#f3f5fb; --panel:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e6e9f2;
  --brand:#4f46e5; --brand-2:#7c3aed; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}

/* ---------- 登录 ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1e3a8a,#7c3aed);padding:20px;z-index:50}
.loginbox{width:min(92vw,380px);background:#fff;border-radius:20px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.loginbox h1{font-size:20px;letter-spacing:1px;margin-bottom:4px}
.loginbox p{color:var(--muted);font-size:13px;margin-bottom:20px}
.loginbox input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none;margin-bottom:12px}
.loginbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.loginbox button{width:100%;padding:12px;border-radius:10px;background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;letter-spacing:2px}
.loginmsg{color:var(--danger);font-size:13px;min-height:20px;margin-bottom:6px}

/* ---------- 布局 ---------- */
#app{display:none}
header{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#1e3a8a,#4f46e5 55%,#7c3aed);color:#fff;padding:12px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(30,58,138,.25)}
header h1{font-size:16px;letter-spacing:1px;white-space:nowrap}
header .sp{flex:1}
.hbtn{padding:7px 13px;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;font-size:13px;white-space:nowrap;transition:.15s}
.hbtn:hover{background:rgba(255,255,255,.28)}
.hbtn.primary{background:#fff;color:var(--brand);font-weight:700}
.hbtn.primary:hover{background:#f5f3ff}
main{padding:16px 20px 90px;max-width:1600px;margin:0 auto}

/* ---------- 统计卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;letter-spacing:.5px}
.stat span{color:var(--muted);font-size:12px}
.stat.accent b{color:var(--brand)}

/* ---------- 筛选 ---------- */
.toolbar{background:var(--panel);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:12px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input[type=search]{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;outline:none;background:#fbfcfe}
.toolbar select:focus,.toolbar input[type=search]:focus{border-color:var(--brand)}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar .grow{flex:1}

/* ---------- 表格 ---------- */
.tablewrap{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f8f9fd;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;position:sticky;top:0}
tbody tr:hover{background:#fafbff}
tbody tr.sel{background:#eef2ff}
td.q{max-width:520px}
.qtext{font-weight:600;margin-bottom:4px;word-break:break-word}
.qopts{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.qopts i{font-style:normal}
.qopts i.ok{color:var(--ok);font-weight:700}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;background:#eef2ff;color:#4338ca;white-space:nowrap}
.tag.g1{background:#ecfdf5;color:#047857}.tag.g2{background:#eff6ff;color:#1d4ed8}.tag.g3{background:#fef3c7;color:#b45309}
.tag.admin{background:#fce7f3;color:#be185d}
.tag.edit{background:#fff7ed;color:#c2410c}
.tag.del{background:#fee2e2;color:#b91c1c}
.lv{font-weight:700;color:var(--warn);letter-spacing:1px}
.rowacts{display:flex;gap:6px;white-space:nowrap}
.mini{padding:4px 9px;border-radius:7px;font-size:12px;background:#f1f5f9;color:#334155}
.mini:hover{background:#e2e8f0}
.mini.danger{background:#fef2f2;color:var(--danger)}
.mini.danger:hover{background:#fee2e2}
.mini.ok{background:#f0fdf4;color:var(--ok)}

/* ---------- 分页 ---------- */
.pager{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.pager button{padding:6px 12px;border-radius:8px;background:#f1f5f9;color:#334155}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* ---------- 批量条 ---------- */
.bulkbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);transition:.25s;
  background:#111827;color:#fff;border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:30;flex-wrap:wrap;justify-content:center;max-width:94vw}
.bulkbar.on{transform:translateX(-50%) translateY(0)}
.bulkbar b{color:#fde68a}
.bulkbar button{padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;font-size:13px}
.bulkbar button:hover{background:rgba(255,255,255,.3)}
.bulkbar button.danger{background:#dc2626}
.bulkbar button.close{background:transparent;font-size:16px;line-height:1}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.mask.on{display:flex}
.modal{background:#fff;border-radius:18px;width:min(96vw,680px);box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
.modal header{position:static;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:16px 20px;
  border-radius:18px 18px 0 0;box-shadow:none;display:flex;align-items:center}
.modal header h2{font-size:16px}
.modal .body{padding:18px 20px;max-height:70vh;overflow:auto}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:16px}
.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
.field label .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.field input[type=text],.field textarea,.field select{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;outline:none;background:#fbfcfe}
.field input[type=text]:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.field textarea{resize:vertical;min-height:64px;line-height:1.6}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.optrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.optrow input[type=radio]{width:18px;height:18px;accent-color:var(--ok);flex:none}
.optrow input[type=text]{flex:1}
.optrow .flag{font-size:12px;color:var(--ok);width:36px;text-align:center;flex:none}
.btn{padding:9px 18px;border-radius:10px;background:#f1f5f9;color:#334155;font-weight:600}
.btn.primary{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.formerr{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}

/* 导出下拉 */
.split{position:relative;display:flex}
.split .hbtn.l{ border-radius:9px 0 0 9px}
.split .hbtn.caret{border-radius:0 9px 9px 0;padding:7px 9px;border-left:1px solid rgba(255,255,255,.28)}
.menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:11px;
  box-shadow:0 14px 34px rgba(15,23,42,.18);padding:6px;min-width:196px;display:none;z-index:80}
.menu.on{display:block}
.menu a{display:block;padding:8px 11px;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.menu a:hover{background:#f3f4ff;color:var(--brand)}
.menu a.b{color:var(--danger)}.menu a.b:hover{background:#fef2f2;color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}

/* 导入预检 */
.radrow{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#374151}
.radrow label{display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer}
.pchips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pchip{padding:4px 11px;border-radius:99px;font-size:12px;background:#eef2ff;color:#4338ca}
.pchip b{margin-left:3px}
.pchip.ok{background:#ecfdf5;color:#047857}
.pchip.warn{background:#fff7ed;color:#c2410c}
.pchip.bad{background:#fee2e2;color:#b91c1c}
.preview{border:1px solid var(--line);border-radius:10px;max-height:236px;overflow:auto}
.preview table{width:100%;font-size:12px}
.preview td,.preview th{padding:6px 9px;border-bottom:1px solid var(--line)}
.preview th{background:#f8f9fd;position:static}
.note{font-size:12px;color:var(--muted);margin:6px 0}
details summary{cursor:pointer;font-size:13px;color:var(--muted);margin:2px 0 8px;user-select:none}
details[open] summary{margin-bottom:10px}
.filerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- Toast ---------- */
#toasts{position:fixed;top:16px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);
  animation:tin .2s ease-out;max-width:70vw}
.toast.ok{background:#065f46}.toast.err{background:#991b1b}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- 空态 ---------- */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}

@media (max-width:860px){
  main{padding:12px 10px 100px}
  td.q{max-width:none}
  .col-kp,.col-src{display:none}
  header{padding:10px 12px;gap:8px}
  header h1{font-size:14px}
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="loginbox">
    <h1>🗂️ 题库后台</h1>
    <p>知识擂台 · 题目增删改查</p>
    <div class="loginmsg" id="loginMsg"></div>
    <input type="password" id="pw" placeholder="管理员密码" autocomplete="current-password">
    <button id="loginBtn">登 录</button>
    <p style="margin:14px 0 0;font-size:12px">首次使用默认密码 <b>admin123</b>，登录后请及时修改。</p>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <h1>🗂️ 题库后台</h1>
    <span class="sp"></span>
    <button class="hbtn primary" id="btnAdd">＋ 新增题目</button>
    <button class="hbtn" id="btnImport">导入</button>
    <div class="split">
      <button class="hbtn l" id="btnExport">导出 Excel</button>
      <button class="hbtn caret" id="btnExportMore">▾</button>
      <div class="menu" id="exportMenu">
        <a data-act="xlsx">导出全部（Excel）</a>
        <a data-act="xlsx-scoped">只导出当前筛选结果</a>
        <a data-act="json">导出全部（JSON 备份）</a>
        <hr>
        <a data-act="tpl">下载空白模板</a>
      </div>
    </div>
    <button class="hbtn" id="btnAudit">操作日志</button>
    <button class="hbtn" id="btnPwd">改密码</button>
    <button class="hbtn" id="btnLogout">退出</button>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <select id="fGrade"><option value="">全部年级</option></select>
      <select id="fSubj"><option value="all">全部科目</option></select>
      <select id="fLevel"><option value="">全部难度</option>
        <option value="1">★ 基础</option><option value="2">★★ 进阶</option><option value="3">★★★ 挑战</option>
      </select>
      <select id="fKp"><option value="all">全部知识点</option></select>
      <select id="fStatus">
        <option value="">全部状态</option>
        <option value="added">我新增的</option>
        <option value="edited">我改过的</option>
        <option value="deleted">已删除</option>
      </select>
      <input type="search" id="fKw" placeholder="搜索题干 / 选项 / 知识点…">
      <button class="mini" id="btnReset">重置</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th style="width:34px"><input type="checkbox" id="chkAll"></th>
            <th>题目</th>
            <th style="width:64px">科目</th>
            <th style="width:96px">年级</th>
            <th class="col-kp" style="width:110px">知识点</th>
            <th style="width:58px">难度</th>
            <th class="col-src" style="width:74px">状态</th>
            <th style="width:130px">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <div class="bulkbar" id="bulkbar">
    <span>已选 <b id="bulkCount">0</b> 道</span>
    <button data-bulk="level">设难度</button>
    <button data-bulk="kp">设知识点</button>
    <button data-bulk="grade">加年级</button>
    <button data-bulk="delete" class="danger">删除</button>
    <button data-bulk="restore">恢复</button>
    <button class="close" id="bulkClear">✕</button>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="mask" id="editMask">
  <div class="modal">
    <header><h2 id="editTitle">新增题目</h2></header>
    <div class="body">
      <div class="field">
        <label>题干 <span class="hint">最多 300 字</span></label>
        <textarea id="eText" placeholder="例如：下面哪个是哺乳动物？"></textarea>
      </div>
      <div class="field">
        <label>选项 <span class="hint">点左侧圆点设为正确答案</span></label>
        <div id="eOpts"></div>
      </div>
      <div class="field">
        <label>适用年级 <span class="hint">可多选，题目会出现在这些年级的题池里</span></label>
        <div class="chips" id="eGrades"></div>
      </div>
      <div class="field" style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px">
          <label>科目</label>
          <select id="eSubj"></select>
        </div>
        <div style="flex:1;min-width:140px">
          <label>知识点 <span class="hint">可新建</span></label>
          <input type="text" id="eKp" list="kpList" placeholder="如：古诗积累">
          <datalist id="kpList"></datalist>
        </div>
        <div style="width:120px">
          <label>难度</label>
          <select id="eLevel">
            <option value="1">★ 基础</option><option value="2">★★ 进阶</option><option value="3">★★★ 挑战</option>
          </select>
        </div>
      </div>
      <div class="formerr" id="editErr"></div>
    </div>
    <footer>
      <button class="btn" id="editCancel">取消</button>
      <button class="btn" id="editSaveNext">保存并继续新增</button>
      <button class="btn primary" id="editSave">保存</button>
    </footer>
  </div>
</div>

<!-- 通用输入弹窗 -->
<div class="mask" id="promptMask">
  <div class="modal" style="width:min(94vw,420px)">
    <header><h2 id="promptTitle">请输入</h2></header>
    <div class="body">
      <div class="field"><input type="text" id="promptInput"></div>
      <div class="formerr" id="promptErr"></div>
    </div>
    <footer>
      <button class="btn" id="promptCancel">取消</button>
      <button class="btn primary" id="promptOk">确定</button>
    </footer>
  </div>
</div>

<!-- 导入弹窗 -->
<div class="mask" id="importMask">
  <div class="modal" style="max-width:760px">
    <header><h2>批量导入</h2></header>
    <div class="body">
      <div class="field">
        <label>选择文件 <span class="hint">Excel（.xlsx / .xls）或 .csv（UTF-8）</span></label>
        <div class="filerow">
          <input type="file" id="importFile" accept=".xlsx,.xls,.csv,.json">
          <button class="btn" id="btnTpl2">下载模板</button>
        </div>
      </div>

      <div class="field">
        <label>遇到题库里已有的题</label>
        <div class="radrow">
          <label><input type="radio" name="imode" value="create" checked> 跳过，只加新题</label>
          <label><input type="radio" name="imode" value="upsert"> 按题目ID / 相同题干 覆盖更新</label>
        </div>
        <div class="note">选了覆盖更新时，题目ID 能在库里找到就更新那道题；找不到但题干一模一样，也会更新而不是重复添加。</div>
      </div>

      <details id="jsonBox">
        <summary>高级：直接粘贴 JSON</summary>
        <textarea id="importText" style="min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px"
          placeholder='[{"subj":"数学","text":"…","options":["A","B","C","D"],"correct":0,"grades":[3],"kp":"…","level":2}]'></textarea>
      </details>

      <div class="formerr" id="importErr"></div>
      <div id="importPreview"></div>
      <div id="importResult" style="font-size:13px"></div>
    </div>
    <footer>
      <button class="btn" id="importCancel">关闭</button>
      <button class="btn" id="importCheck">先预检</button>
      <button class="btn primary" id="importGo">开始导入</button>
    </footer>
  </div>
</div>

<!-- 日志弹窗 -->
<div class="mask" id="auditMask">
  <div class="modal">
    <header><h2>操作日志</h2></header>
    <div class="body"><div id="auditBody"></div></div>
    <footer><button class="btn" id="auditClose">关闭</button></footer>
  </div>
</div>

<div id="toasts"></div>

<script>
/* =============================== 基础 =============================== */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GRADES = [1, 2, 3, 4, 5, 6];
const SUBJECTS = ['语文', '数学', '科学', '英语', '品德', '安全'];
const LVNAME = { 1: '★', 2: '★★', 3: '★★★' };
const GNAME = g => ['', '一', '二', '三', '四', '五', '六'][g] + '年级';

let TOKEN = sessionStorage.getItem('adminToken') || '';
let STATS = null;
let selection = new Set();
let editingId = null;
const state = { grade: '', subj: 'all', level: '', kp: 'all', status: '', keyword: '', page: 1, size: 20 };
let kwTimer = null;

function toast(msg, type) {
  const t = el('div', 'toast ' + (type || ''), esc(msg));
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 320); }, 2600);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': TOKEN, ...(opts.headers || {}) },
  });
  let data = {};
  try { data = await res.json(); } catch { }
  if (res.status === 401) { logout(true); throw new Error('登录已过期，请重新登录'); }
  if (!res.ok) throw new Error(data.error || ('请求失败 HTTP ' + res.status));
  return data;
}

/* =============================== 登录 =============================== */
async function doLogin() {
  const pw = $('#pw').value.trim();
  if (!pw) { $('#loginMsg').textContent = '请输入密码'; return; }
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '登录失败');
    TOKEN = d.token;
    sessionStorage.setItem('adminToken', TOKEN);
    enterApp();
  } catch (e) { $('#loginMsg').textContent = e.message; }
}
function logout(silent) {
  TOKEN = '';
  sessionStorage.removeItem('adminToken');
  $('#app').style.display = 'none';
  $('#login').style.display = 'flex';
  $('#pw').value = '';
  if (!silent) toast('已退出登录');
}
async function enterApp() {
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  await loadStats();
  await loadList();
}
$('#loginBtn').onclick = doLogin;
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#btnLogout').onclick = () => logout();

/* =============================== 统计 =============================== */
function renderStats() {
  const s = STATS;
  const box = $('#stats');
  box.innerHTML = `
    <div class="stat accent"><b>${s.total}</b><span>生效题目总数</span></div>
    <div class="stat"><b>${s.kpCount}</b><span>知识点</span></div>
    <div class="stat"><b>${s.counts.added}</b><span>我新增的</span></div>
    <div class="stat"><b>${s.counts.patched}</b><span>我修改的</span></div>
    <div class="stat"><b>${s.counts.deleted}</b><span>已删除</span></div>
    <div class="stat"><b>${s.base}</b><span>构建底库</span></div>
  `;

  // 年级下拉
  const fg = $('#fGrade');
  fg.innerHTML = '<option value="">全部年级</option>' +
    GRADES.map(g => `<option value="${g}">${GNAME(g)}（${s.byGrade[g] || 0}）</option>`).join('');
  fg.value = state.grade;

  // 科目下拉
  const fs = $('#fSubj');
  fs.innerHTML = '<option value="all">全部科目</option>' +
    SUBJECTS.map(x => `<option value="${x}">${x}（${s.bySubject[x] || 0}）</option>`).join('');
  fs.value = state.subj;

  // 知识点下拉（按当前科目过滤）
  const fk = $('#fKp');
  const kps = s.kpList.filter(x => state.subj === 'all' || x.kp.startsWith(state.subj + '/'));
  fk.innerHTML = '<option value="all">全部知识点</option>' +
    kps.map(x => `<option value="${esc(x.kp.split('/')[1])}">${esc(x.kp.split('/')[1])}（${x.n}）</option>`).join('');
  fk.value = state.kp;

  // 编辑弹窗的知识点候选
  const dl = $('#kpList');
  dl.innerHTML = s.kpList.map(x => `<option value="${esc(x.kp.split('/')[1])}"></option>`).join('');
}

async function loadStats() {
  STATS = await api('/admin/summary');
  renderStats();
}

/* =============================== 列表 =============================== */
async function loadList() {
  const p = new URLSearchParams();
  if (state.grade) p.set('grade', state.grade);
  if (state.subj !== 'all') p.set('subj', state.subj);
  if (state.level) p.set('level', state.level);
  if (state.kp !== 'all') p.set('kp', state.kp);
  if (state.status) p.set('status', state.status);
  if (state.keyword) p.set('keyword', state.keyword);
  p.set('page', state.page);
  p.set('size', state.size);

  let d;
  try { d = await api('/admin/questions?' + p.toString()); }
  catch (e) { toast(e.message, 'err'); return; }
  renderTable(d);
}

function renderTable(d) {
  const tb = $('#tbody');
  tb.innerHTML = '';
  if (!d.rows.length) {
    tb.innerHTML = `<tr><td colspan="8"><div class="empty"><b>没有符合条件的题目</b>换个筛选条件，或点右上角「＋ 新增题目」</div></td></tr>`;
  }
  for (const q of d.rows) {
    const tr = el('tr');
    if (selection.has(q.id)) tr.classList.add('sel');

    const status = q._deleted ? '<span class="tag del">已删除</span>'
      : q._added ? '<span class="tag admin">新增</span>'
      : q._edited ? '<span class="tag edit">已修改</span>'
      : '<span class="tag">原题</span>';

    const opts = q.options.map((o, i) => i === q.correct
      ? `<i class="ok">✓ ${esc(o)}</i>` : `<i>${esc(o)}</i>`).join('');

    tr.innerHTML = `
      <td><input type="checkbox" data-id="${q.id}" ${selection.has(q.id) ? 'checked' : ''}></td>
      <td class="q"><div class="qtext">${esc(q.text)}</div><div class="qopts">${opts}</div></td>
      <td><span class="tag">${esc(q.subj)}</span></td>
      <td>${(q.grades || []).map(g => `<span class="tag g${g}">${'一二三四五六'[g - 1]}</span>`).join(' ')}</td>
      <td class="col-kp"><span style="font-size:12px">${esc(q.kp)}</span></td>
      <td><span class="lv">${LVNAME[q.level] || q.level}</span></td>
      <td class="col-src">${status}</td>
      <td><div class="rowacts">
        ${q._deleted ? `<button class="mini ok" data-act="restore" data-id="${q.id}">恢复</button>`
          : `<button class="mini" data-act="edit" data-id="${q.id}">编辑</button>
             <button class="mini danger" data-act="del" data-id="${q.id}">删除</button>`}
      </div></td>`;
    tb.appendChild(tr);
  }

  // 全选状态
  const allChecked = d.rows.length > 0 && d.rows.every(q => selection.has(q.id));
  $('#chkAll').checked = allChecked;

  $('#pager').innerHTML = `
    <span>共 <b>${d.total}</b> 道 · 第 ${d.page}/${d.pages} 页</span>
    <span class="sp" style="flex:1"></span>
    <select id="pgSize" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px">
      ${[20, 50, 100, 200].map(n => `<option value="${n}" ${n === d.size ? 'selected' : ''}>${n} 条/页</option>`).join('')}
    </select>
    <button id="pgPrev" ${d.page <= 1 ? 'disabled' : ''}>上一页</button>
    <button id="pgNext" ${d.page >= d.pages ? 'disabled' : ''}>下一页</button>`;

  $('#pgSize').onchange = e => { state.size = Number(e.target.value); state.page = 1; loadList(); };
  $('#pgPrev').onclick = () => { state.page = Math.max(1, state.page - 1); loadList(); };
  $('#pgNext').onclick = () => { state.page = state.page + 1; loadList(); };

  updateBulkBar();
}

/* 表格内事件委托 */
document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (btn) {
    const id = btn.dataset.id;
    if (btn.dataset.act === 'edit') return openEditor(id);
    if (btn.dataset.act === 'del') return confirmDelete([id]);
    if (btn.dataset.act === 'restore') return doRestore([id]);
    return;
  }
  if (e.target.id === 'chkAll') {
    const on = e.target.checked;
    document.querySelectorAll('#tbody input[type=checkbox][data-id]').forEach(c => {
      const id = c.dataset.id;
      if (on) selection.add(id); else selection.delete(id);
      c.closest('tr').classList.toggle('sel', on);
    });
    updateBulkBar();
    return;
  }
  if (e.target.matches('#tbody input[type=checkbox][data-id]')) {
    const id = e.target.dataset.id;
    if (e.target.checked) selection.add(id); else selection.delete(id);
    e.target.closest('tr').classList.toggle('sel', e.target.checked);
    updateBulkBar();
  }
});

/* =============================== 编辑器 =============================== */
function optRow(i, val, checked) {
  const row = el('div', 'optrow');
  row.innerHTML = `
    <input type="radio" name="corr" value="${i}" ${checked ? 'checked' : ''}>
    <span class="flag" data-flag="${i}">${checked ? '正确' : ''}</span>
    <input type="text" value="${esc(val || '')}" placeholder="选项 ${'ABCD'[i]}">`;
  return row;
}

function renderOpts(options, correct) {
  const box = $('#eOpts');
  box.innerHTML = '';
  for (let i = 0; i < 4; i++) box.appendChild(optRow(i, options ? options[i] : '', correct === i));
}

/* 选项区事件只绑一次（委托），避免每次开弹窗重复绑定 */
$('#eOpts').addEventListener('change', e => {
  if (e.target.name !== 'corr') return;
  const v = e.target.value;
  $('#eOpts').querySelectorAll('[data-flag]').forEach(f => {
    f.textContent = f.dataset.flag === v ? '正确' : '';
  });
});

function renderGradeChips(selected) {
  const box = $('#eGrades');
  box.innerHTML = '';
  for (const g of GRADES) {
    const c = el('button', 'chip' + (selected.includes(g) ? ' on' : ''), GNAME(g));
    c.type = 'button';
    c.onclick = () => c.classList.toggle('on');
    box.appendChild(c);
  }
}

function openEditor(id) {
  editingId = id || null;
  $('#editErr').textContent = '';
  $('#editTitle').textContent = id ? '编辑题目' : '新增题目';

  const subjSel = $('#eSubj');
  subjSel.innerHTML = SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join('');

  if (id) {
    api('/admin/questions/' + encodeURIComponent(id)).then(q => {
      $('#eText').value = q.text;
      subjSel.value = q.subj;
      $('#eKp').value = q.kp;
      $('#eLevel').value = String(q.level);
      renderGradeChips(q.grades || [q.grade]);
      renderOpts(q.options, q.correct);
    }).catch(e => toast(e.message, 'err'));
  } else {
    $('#eText').value = '';
    subjSel.value = state.subj !== 'all' ? state.subj : '语文';
    $('#eKp').value = '';
    $('#eLevel').value = state.level || '2';
    renderGradeChips(state.grade ? [Number(state.grade)] : [1]);
    renderOpts(['', '', '', ''], 0);
  }
  $('#editMask').classList.add('on');
  setTimeout(() => $('#eText').focus(), 60);
}

function closeEditor() { $('#editMask').classList.remove('on'); editingId = null; }

function collectEditor() {
  const options = [...$('#eOpts').querySelectorAll('.optrow input[type=text]')].map(i => i.value.trim());
  const corrEl = $('#eOpts').querySelector('input[name=corr]:checked');
  // 年级按钮顺序与 GRADES 一一对应，按下标取选中项
  const picked = [...$('#eGrades').children].map((c, i) => c.classList.contains('on') ? GRADES[i] : null).filter(Boolean);
  return {
    text: $('#eText').value.trim(),
    options,
    correct: corrEl ? Number(corrEl.value) : -1,
    grades: picked,
    subj: $('#eSubj').value,
    kp: $('#eKp').value.trim(),
    level: Number($('#eLevel').value) || 2,
  };
}

async function saveQuestion(keepOpen) {
  const payload = collectEditor();
  $('#editErr').textContent = '';
  try {
    if (editingId) {
      await api('/admin/questions/' + encodeURIComponent(editingId), { method: 'PUT', body: JSON.stringify(payload) });
      toast('已保存修改');
    } else {
      await api('/admin/questions', { method: 'POST', body: JSON.stringify(payload) });
      toast('已新增题目');
    }
    await loadStats();
    await loadList();
    if (keepOpen && !editingId) {
      // 连续录入：清空题干和选项，保留科目/年级/难度
      $('#eText').value = '';
      renderOpts(['', '', '', ''], 0);
      $('#eKp').value = '';
      $('#eText').focus();
    } else {
      closeEditor();
    }
  } catch (e) {
    $('#editErr').textContent = e.message;
  }
}

$('#btnAdd').onclick = () => openEditor(null);
$('#editCancel').onclick = closeEditor;
$('#editSave').onclick = () => saveQuestion(false);
$('#editSaveNext').onclick = () => { if (!editingId) saveQuestion(true); else saveQuestion(false); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    ['#editMask', '#promptMask', '#importMask', '#auditMask'].forEach(s => $(s).classList.remove('on'));
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && $('#editMask').classList.contains('on')) {
    e.preventDefault(); saveQuestion(false);
  }
});

/* =============================== 删除 / 恢复 =============================== */
function confirmDelete(ids) {
  if (!ids.length) return;
  const one = ids.length === 1;
  const tip = one ? '确定删除这道题？' : `确定删除选中的 ${ids.length} 道题？`;
  if (!confirm(tip + '\n\n删除后不会立刻消失：可以在「全部状态 → 已删除」里找回。')) return;
  (async () => {
    try {
      if (one) await api('/admin/questions/' + encodeURIComponent(ids[0]), { method: 'DELETE' });
      else await api('/admin/bulk', { method: 'POST', body: JSON.stringify({ action: 'delete', ids }) });
      toast(one ? '已删除 1 道' : `已删除 ${ids.length} 道`);
      selection.clear();
      await loadStats(); await loadList();
    } catch (e) { toast(e.message, 'err'); }
  })();
}

async function doRestore(ids) {
  try {
    if (ids.length === 1) await api('/admin/questions/' + encodeURIComponent(ids[0]) + '/restore', { method: 'POST' });
    else await api('/admin/bulk', { method: 'POST', body: JSON.stringify({ action: 'restore', ids }) });
    toast(`已恢复 ${ids.length} 道`);
    selection.clear();
    await loadStats(); await loadList();
  } catch (e) { toast(e.message, 'err'); }
}

/* =============================== 批量 =============================== */
function updateBulkBar() {
  $('#bulkCount').textContent = selection.size;
  $('#bulkbar').classList.toggle('on', selection.size > 0);
}
$('#bulkClear').onclick = () => {
  selection.clear();
  document.querySelectorAll('#tbody input[type=checkbox][data-id]').forEach(c => { c.checked = false; c.closest('tr').classList.remove('sel'); });
  $('#chkAll').checked = false;
  updateBulkBar();
};

/* 通用输入弹窗 */
function askText(title, placeholder, defaultValue) {
  return new Promise(resolve => {
    $('#promptTitle').textContent = title;
    $('#promptInput').value = defaultValue || '';
    $('#promptInput').placeholder = placeholder || '';
    $('#promptErr').textContent = '';
    $('#promptMask').classList.add('on');
    setTimeout(() => $('#promptInput').focus(), 60);
    const done = ok => {
      $('#promptMask').classList.remove('on');
      $('#promptOk').onclick = $('#promptCancel').onclick = null;
      resolve(ok ? $('#promptInput').value.trim() : null);
    };
    $('#promptOk').onclick = () => done(true);
    $('#promptCancel').onclick = () => done(false);
    $('#promptInput').onkeydown = e => { if (e.key === 'Enter') done(true); };
  });
}

document.querySelectorAll('[data-bulk]').forEach(b => {
  b.onclick = async () => {
    const ids = [...selection];
    if (!ids.length) return;
    const kind = b.dataset.bulk;
    try {
      if (kind === 'delete') return confirmDelete(ids);
      if (kind === 'restore') return doRestore(ids);

      let patch = {};
      if (kind === 'level') {
        const v = await askText('批量设置难度', '输入 1 / 2 / 3（1=基础 2=进阶 3=挑战）', '2');
        if (!v) return;
        if (!['1', '2', '3'].includes(v.trim())) return toast('难度只能是 1 / 2 / 3', 'err');
        patch = { level: Number(v) };
      } else if (kind === 'kp') {
        const v = await askText('设置知识点', '例如：古诗积累', '');
        if (!v) return;
        patch = { kp: v };
      } else if (kind === 'grade') {
        const v = await askText('追加适用年级', '输入 1-6，多个用逗号：如 3,4', '');
        if (!v) return;
        const add = v.split(/[,，\s]+/).map(Number).filter(g => GRADES.includes(g));
        if (!add.length) return toast('没有识别到有效年级', 'err');
        const r = await api('/admin/bulk', { method: 'POST', body: JSON.stringify({ action: 'update', ids, patch: { addGrades: add } }) });
        toast(`已处理 ${r.ok} 道` + (r.failed.length ? `，${r.failed.length} 道失败` : ''));
        selection.clear(); await loadStats(); await loadList();
        return;
      }
      const r = await api('/admin/bulk', { method: 'POST', body: JSON.stringify({ action: 'update', ids, patch }) });
      toast(`已处理 ${r.ok} 道` + (r.failed.length ? `，${r.failed.length} 道失败` : ''));
      selection.clear(); await loadStats(); await loadList();
    } catch (e) { toast(e.message, 'err'); }
  };
});

async function uploadXlsx(dry) {
  const res = await fetch(`/api/admin/import.xlsx?dry=${dry ? 1 : 0}&mode=${imode()}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/octet-stream', 'X-Admin-Token': TOKEN },
    body: IMPORT_FILE,
  });
  let data = {};
  try { data = await res.json(); } catch { }
  if (res.status === 401) { logout(true); throw new Error('登录已过期，请重新登录'); }
  if (!res.ok) throw new Error(data.error || ('请求失败 HTTP ' + res.status));
  return data;
}

const ACTNAME = { create: ['新增', 'admin'], update: ['更新', 'edit'], skip: ['跳过', ''] };

function renderPreview(d) {
  const chips = [
    ['共读入', d.total, ''],
    ['新增', d.create, 'ok'],
    ['更新', d.update, 'warn'],
    ['跳过', d.skip, ''],
    ['有问题', d.error, 'bad'],
  ].filter(c => c[1] != null && c[1] !== 0)
    .map(([l, n, c]) => `<span class="pchip ${c}">${l}<b>${n}</b></span>`).join('');

  let html = `<div class="pchips">${chips || '<span class="pchip">没有可导入的行</span>'}</div>`;
  if (d.unknownColumns && d.unknownColumns.length) {
    html += `<div class="note">已忽略的列：${d.unknownColumns.map(esc).join('、')}</div>`;
  }
  if (d.preview && d.preview.length) {
    html += `<div class="preview"><table>
      <thead><tr><th style="width:56px">行号</th><th style="width:60px">动作</th><th>题干</th></tr></thead>
      <tbody>${d.preview.map(p => `<tr><td>${p.row}</td><td><span class="tag ${ACTNAME[p.action][1]}">${ACTNAME[p.action][0]}</span></td><td>${esc(p.text)}</td></tr>`).join('')}</tbody>
    </table></div>`;
  }
  if (d.failed && d.failed.length) {
    html += `<div class="note" style="margin-top:14px;color:#b91c1c">需要处理的行（共 ${d.failed.length} 条，其余正常导入）：</div>
    <div class="preview"><table>
      <thead><tr><th style="width:56px">行</th><th style="width:62px">类型</th><th>原因</th></tr></thead>
      <tbody>${d.failed.map(f => `<tr><td>${f.row}</td><td>${f.action === 'skip' ? '跳过' : '<span style="color:#b91c1c">错误</span>'}</td><td>${esc(f.error)}</td></tr>`).join('')}</tbody>
    </table></div>`;
  }
  $('#importPreview').innerHTML = html;
}

async function runPreview() {
  if (!IMPORT_FILE) { $('#importErr').textContent = '请先选择一个 Excel / CSV 文件'; return null; }
  $('#importErr').textContent = '正在读取表格…';
  try {
    const d = await uploadXlsx(true);
    $('#importErr').textContent = '';
    renderPreview(d);
    return d;
  } catch (e) {
    $('#importErr').textContent = e.message;
    return null;
  }
}

$('#importCheck').onclick = runPreview;

$('#importFile').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  $('#importErr').textContent = '';
  $('#importPreview').innerHTML = '';
  $('#importResult').innerHTML = '';
  if (!f) { IMPORT_FILE = null; return; }

  if (/\.json$/i.test(f.name)) {
    IMPORT_FILE = null;
    try { $('#importText').value = await f.text(); }
    catch { $('#importErr').textContent = '这个文件读不出来'; return; }
    $('#jsonBox').open = true;
    return;
  }
  IMPORT_FILE = f;
  $('#importText').value = '';
  await runPreview();
};

$('#importGo').onclick = async () => {
  $('#importErr').textContent = '';
  $('#importResult').innerHTML = '';

  try {
    /* ---- 表格导入 ---- */
    if (IMPORT_FILE) {
      const d = await uploadXlsx(false);
      let html = `<div style="color:#065f46">导入完成：新增 <b>${d.created}</b> 道，更新 <b>${d.updated}</b> 道`;
      if (d.skipped) html += `，跳过 ${d.skipped} 道`;
      if (d.failed) html += `，<b style="color:#b91c1c">失败 ${d.failed} 道</b>`;
      html += '</div>';
      if (d.failedRows && d.failedRows.length) {
        html += `<div class="preview" style="margin-top:10px"><table>
          <thead><tr><th style="width:56px">行</th><th>原因</th></tr></thead>
          <tbody>${d.failedRows.map(f => `<tr><td>${f.row}</td><td>${esc(f.error)}</td></tr>`).join('')}</tbody>
        </table></div>`;
      }
      $('#importResult').innerHTML = html;
      $('#importPreview').innerHTML = '';
      await loadStats(); await loadList();
      toast(`导入完成：新增 ${d.created} / 更新 ${d.updated}`);
      return;
    }

    /* ---- JSON 粘贴 ---- */
    const raw = $('#importText').value.trim();
    if (!raw) { $('#importErr').textContent = '请选择文件，或粘贴 JSON'; return; }
    let data;
    try { data = JSON.parse(raw); }
    catch (e) { $('#importErr').textContent = 'JSON 解析失败：' + e.message; return; }
    const rows = Array.isArray(data) ? data : (Array.isArray(data.questions) ? data.questions : null);
    if (!rows) { $('#importErr').textContent = '需要一个题目数组'; return; }

    const r = await api('/admin/import', { method: 'POST', body: JSON.stringify({ questions: rows }) });
    const failTip = r.failed.length
      ? '<div style="margin-top:8px;color:#b91c1c">失败示例：<br>' + r.failed.slice(0, 8).map(f => esc(f.text) + ' → ' + esc(f.error)).join('<br>') + '</div>'
      : '';
    $('#importResult').innerHTML = `<div style="color:#065f46">成功导入 <b>${r.ok}</b> 道；失败 ${r.failedCount} 道</div>${failTip}`;
    await loadStats(); await loadList();
  } catch (e) { $('#importErr').textContent = e.message; }
};

$('#btnAudit').onclick = async () => {
  try {
    const rows = await api('/admin/audit?limit=120');
    $('#auditBody').innerHTML = rows.length ? rows.map(r => `
      <div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">
        <span class="tag">${esc(r.action)}</span>
        <span style="color:var(--muted);margin-left:6px">${new Date(r.at).toLocaleString('zh-CN')}</span>
        <div style="margin-top:2px">${esc(r.text || r.id || '')}</div>
      </div>`).join('') : '<div class="empty">还没有操作记录</div>';
    $('#auditMask').classList.add('on');
  } catch (e) { toast(e.message, 'err'); }
};
$('#auditClose').onclick = () => $('#auditMask').classList.remove('on');

$('#btnPwd').onclick = async () => {
  const pw = await askText('修改管理员密码', '至少 6 位，例如 learn2026', '');
  if (!pw) return;
  try {
    const r = await api('/admin/password', { method: 'POST', body: JSON.stringify({ password: pw }) });
    TOKEN = r.token; sessionStorage.setItem('adminToken', TOKEN);
    toast('密码已更新');
  } catch (e) { toast(e.message, 'err'); }
};

/* =============================== 启动 =============================== */
(async function boot() {
  if (!TOKEN) return;
  try {
    await enterApp();
  } catch (e) {
    if (TOKEN) logout(true);
  }
})();
</script>
</body>
</html>
