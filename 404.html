<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>页面走丢了 · 知作坊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #fff;
    text-align: center;
  }
  .code {
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 800;
    line-height: 1;
    text-shadow: 0 8px 30px rgba(0,0,0,0.3);
    letter-spacing: 8px;
  }
  h1 { font-size: 1.5rem; margin: 18px 0 8px; font-weight: 700; }
  p { opacity: 0.85; font-size: 0.95rem; margin-bottom: 28px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-block;
    padding: 13px 30px;
    border-radius: 24px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  .btn.primary { background: #fff; color: #764ba2; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
  .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.28); }
  .btn.ghost { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); color: #fff; }
  .btn.ghost:hover { background: rgba(255,255,255,0.25); }
  .hot { margin-top: 36px; }
  .hot .t { font-size: 0.85rem; opacity: 0.75; margin-bottom: 12px; }
  .hot a {
    display: inline-block;
    margin: 4px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  .hot a:hover { background: rgba(255,255,255,0.28); }
  .sites { width: 100%; max-width: 880px; margin: 30px 0 6px; text-align: left; }
  .sites-t { font-size: 0.82rem; opacity: 0.72; margin-bottom: 12px; text-align: center; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>哎呀，这个页面走丢了</h1>
  <p>它可能去玩游戏了，回首页或游戏大厅看看吧</p>
  <div class="actions">
    <a class="btn primary" href="/">🏠 回到知作坊</a>
    <a class="btn ghost" href="/games/">🎮 进入欢乐游戏盒</a>
  </div>

  <!-- 站内板块（统一由 /site-cards.js 渲染） -->
  <div class="sites">
    <div class="sites-t">—— 站内其他板块 ——</div>
    <div data-zhz-sc="bar" data-zhz-sc-theme="dark" data-zhz-sc-all="1"></div>
  </div>
  <div class="hot">
    <div class="t">—— 热门小游戏 ——</div>
    <a href="/games/2048.html">🎯 2048</a>
    <a href="/games/snake.html">🐍 贪吃蛇</a>
    <a href="/games/tetris.html">🧱 俄罗斯方块</a>
    <a href="/games/suika.html">🍉 合成大西瓜</a>
    <a href="/games/gomoku.html">⚫ 五子棋</a>
    <a href="/games/minesweeper.html">💣 扫雷</a>
  </div>
<script src="/site-cards.js" defer></script>
<script src="/stats.js" defer></script>
</body>
</html>
