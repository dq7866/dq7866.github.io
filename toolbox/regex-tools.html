<script>
// 正则测试样本：中英文双语切换（textarea 内容不被 translate() 处理，需手动切换）
(function () {
  var ZH = 'Hello World! 你好世界！\n邮箱: test@example.com, admin@company.org\n手机: 13812345678, 15987654321\n日期: 2024-01-15, 2023/12/25\nIP: 192.168.1.1, 10.0.0.255\n网址: https://www.example.com/path?query=1';
  var EN = 'Hello World! Greetings!\nEmail: test@example.com, admin@company.org\nPhone: 13812345678, 15987654321\nDate: 2024-01-15, 2023/12/25\nIP: 192.168.1.1, 10.0.0.255\nURL: https://www.example.com/path?query=1';
  var ZH_PH = '在此输入要测试的文本...';
  var EN_PH = 'Enter text to test here...';
  function applyLang(lang) {
    var ta = document.getElementById('testerInput');
    if (!ta) return;
    var wasUserEdited = ta.dataset.userEdited === '1';
    if (wasUserEdited) return;
    ta.value = (lang === 'en') ? EN : ZH;
    ta.placeholder = (lang === 'en') ? EN_PH : ZH_PH;
  }
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'testerInput') e.target.dataset.userEdited = '1';
  });
  function init() {
    var lang = document.documentElement.getAttribute('data-lang');
    if (!lang) { try { lang = localStorage.getItem('tbx-lang') || 'zh'; } catch (e) { lang = 'zh'; } }
    applyLang(lang);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 30); });
  else setTimeout(init, 30);
  window.addEventListener('tbx-lang-change', function (e) { applyLang(e.detail); });
})();
</script>
