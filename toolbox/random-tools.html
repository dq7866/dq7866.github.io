    <div class="row">
      <div class="field"><label>长度 <span id="pwLenVal" style="color:var(--accent)">16</span></label><input type="range" id="pwLen" min="4" max="64" value="16"></div>

        <label><input type="checkbox" id="pwNoDup"> 字符不重复</label>
      </div>
    </div>
    <div class="btn-row"><button class="btn primary" id="pwGen">生成</button><button class="btn ghost" id="pwCopyAll">复制全部</button></div>

  </section>
